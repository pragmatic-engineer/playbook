# Review by 2026-12-31. Remove each entry when anydoc ships a release that
# no longer depends on the crate, or when the reason below stops being true.
[advisories]
ignore = [
    # zip: these three concern ZipArchive::extract and the stream extractor,
    # which write archive entries to disk. pbdoc and anydoc 0.2.4 only read
    # entries in memory and never call either, so the flaw is not reachable.
    # The fix is zip 9, which anydoc 0.2.4 does not support.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # ttf-parser: an unmaintained notice, not a vulnerability. It is a
    # transitive dependency of pdf-inspector inside anydoc.
    "RUSTSEC-2026-0192",
]
