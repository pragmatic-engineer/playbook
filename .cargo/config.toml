# Bundled SQLite compiles search, spatial and extension-loading code that
# playbook mostly never uses. Dropping it saves about 250 KB in the release
# binary. FTS5 stays on because `playbook code` keeps its text index in it.
# Applies to every profile so tests run against the same SQLite as the release.
[env]
LIBSQLITE3_FLAGS = "-USQLITE_ENABLE_FTS3 -USQLITE_ENABLE_FTS3_PARENTHESIS -USQLITE_ENABLE_RTREE -USQLITE_ENABLE_DBSTAT_VTAB -DSQLITE_OMIT_LOAD_EXTENSION"

# Repo root for tests and embedded reads. `relative = true` resolves against the
# directory that holds `.cargo`, so it stays right wherever a crate lives.
PLAYBOOK_REPO_ROOT = { value = ".", relative = true }
