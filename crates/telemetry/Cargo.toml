[package]
name = "playbook-telemetry"
version.workspace = true
edition.workspace = true
description = "Agent Budget Dashboard for Claude Code sessions: a terminal view, reports and an optional telemetry receiver"
license.workspace = true
repository = "https://github.com/pragmatic-engineer/playbook"
publish = false

[lib]
name = "playbook_telemetry"
path = "src/lib.rs"

[[bin]]
name = "pbtop"
path = "src/bin/pbtop.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.6.7", features = ["derive"] }
libc = "=0.2.190"
playbook-data = { path = "../data" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

[dev-dependencies]
playbook-common = { path = "../common" }

[lints]
workspace = true
