[package]
name = "playbook"
version.workspace = true
edition.workspace = true
description = "Claude Code plugin toolkit: hooks, launcher and installer in one binary"
license.workspace = true
repository = "https://github.com/pragmatic-engineer/playbook"

# cargo binstall downloads the raw release binary. The name must match the
# asset that release.yml uploads, and scripts/asset-names.test.sh fails when
# they differ. { target } is the Rust target triple of the leg that built it.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/playbook-{ version }-{ target }{ binary-ext }"
pkg-fmt = "bin"
# The name `playbook` on crates.io belongs to another project, so a download
# from the quick-install service by crate name could be that project's binary.
disabled-strategies = ["quick-install"]

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
clap_complete = { version = "=4.6.11", default-features = false }
libc = "=0.2.190"
playbook-code = { path = "../code" }
playbook-common = { path = "../common" }
playbook-data = { path = "../data" }
playbook-telemetry = { path = "../telemetry" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
regex = "=1.13.1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

[lints]
workspace = true
