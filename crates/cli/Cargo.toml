[package]
name = "playbook"
version.workspace = true
edition.workspace = true
description = "Claude Code plugin toolkit: hooks, launcher and installer in one binary"
license.workspace = true

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
libc = "=0.2.189"
playbook-code = { path = "../code" }
playbook-common = { path = "../common" }
playbook-data = { path = "../data" }
playbook-telemetry = { git = "https://github.com/pragmatic-engineer/playbook-telemetry", tag = "v0.1.6" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
regex = "=1.13.1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
sha2 = "=0.10.9"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

[lints]
workspace = true
