[package]
name = "playbook-common"
version = "0.1.0"
edition.workspace = true
description = "Shared helpers for the playbook crates: paths, git, sqlite, atomic files"
license.workspace = true
publish = false

[lib]
name = "playbook_common"
path = "src/lib.rs"

[dependencies]
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[lints]
workspace = true
