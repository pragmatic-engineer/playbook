# Dependabot security updates only (ADR 0047, amended 2026-10-20).
#
# Version updates are off: `open-pull-requests-limit: 0` on both ecosystems.
# GitHub documents that limit as the way to disable version updates for a
# package manager, and says security update PRs have a separate fixed limit
# of 10 that this option does not change. The cooldown below is also not
# applied to security updates. Security PRs come from the repo setting
# "Dependabot security updates", which is on. Weekly version PRs were noise.
#
# To turn version updates back on, raise `open-pull-requests-limit` (5 for
# github-actions and 10 for cargo were the old values). The schedule, cooldown
# and groups are kept so that is the only edit.
#
# Each crate's Cargo.toml pins its dependencies exactly, so a security PR
# bumps the pin and Cargo.lock together. dependabot-auto-merge.yml still
# merges Dependabot PRs once CI passes, except major bumps, which wait for
# review.
#
# This file is bespoke: repo-config must keep `manage_dependabot_config =
# false` for this repo, or its next `terraform apply` writes its monthly
# template over this file.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      all-github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 0

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    cooldown:
      default-days: 7
    groups:
      all-cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 0
