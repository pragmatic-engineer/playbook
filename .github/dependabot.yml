# Dependabot version updates (ADR 0048). repo-config also writes this file:
# its playbook entry must match, or the next `terraform apply` puts back the
# empty version.
#
# Weekly, one grouped PR per ecosystem. Cargo.toml pins every crate exactly,
# so a cargo PR bumps the pin and Cargo.lock together. Patch and minor PRs
# are auto-merged by dependabot-auto-merge.yml; a major bump waits for review.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-cargo:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
