# Managed by the agent-factory GitHub App, do not edit by hand, changes will be
# overwritten on the next provisioning run. Job logic lives in protocortex/agent-workflows.
name: Agent Review

on:
  pull_request_target:
    types: [labeled]

jobs:
  review:
    if: github.event.label.name == 'agent:review'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: protocortex/agent-workflows/.github/workflows/agent-review.yml@v1.5.0
    with:
      pr_number: ${{ github.event.pull_request.number }}
      branch: ${{ github.event.pull_request.head.ref }}
      branch_head_sha: ${{ github.event.pull_request.head.sha }}
      install_command: "npm ci"
      build_command: "npm run build"
      node_version: "22"
      model: "claude-sonnet-5-5"
      effort: "medium"
      timeout_minutes: 60
      extra_allowed_domains: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
