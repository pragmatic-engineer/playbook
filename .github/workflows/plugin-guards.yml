#
# Guards for the playbook plugin in plugins/playbook, which the marketplace
# serves as it is.
#   payload-guard: the directory holds only markdown and the manifest, and
#   metadata.breakingChanges in plugin.json lists the plugin entries of
#   breaking-changes.json (ADR 0035 decision 4.6).
#   version-sync: the plugin version in plugin.json, its minBinaryVersion and
#   the workspace version in Cargo.toml are the same (ADR 0038). The binary and
#   the plugin ship as one release line, so a plugin change between releases
#   needs no bump; the release bumps all three.
# They run when the plugin, the versions, the changelog or a script changes,
# and on every push to main.

name: plugin-guards

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "plugins/**"
      - "Cargo.toml"
      - "CHANGELOG.md"
      - "breaking-changes.json"
      - "scripts/check-plugin.sh"
      - "scripts/check-breaking.sh"
      - ".github/workflows/plugin-guards.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: plugin-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payload-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Lint the scripts
        run: shellcheck --severity=warning scripts/check-plugin.sh scripts/check-breaking.sh

      - name: Check the plugin payload
        run: scripts/check-plugin.sh payload

      - name: Check the breaking changes mirror in plugin.json
        run: scripts/check-breaking.sh mirror

  version-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: The binary and the plugin share one version
        run: scripts/check-plugin.sh version
