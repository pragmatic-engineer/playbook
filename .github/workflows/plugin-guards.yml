#
# Guards for the playbook plugin in plugins/playbook, which the marketplace
# serves as it is.
#   payload-guard: the directory holds only markdown and the manifest.
#   version-bump: a plugin change comes with a higher version in plugin.json
#   and a matching "## playbook <version>" section at the top of CHANGELOG.md.
#   When the version rises, a commit since the last plugin tag that touches
#   the plugin, or the pull request title or body, marked breaking needs a
#   plugin entry in breaking-changes.json, and that entry needs a
#   "### Breaking" heading in the changelog section (ADR 0035).
# Both run only when the plugin, the changelog, the record or a script changes.

name: plugin-guards

on:
  pull_request:
    paths:
      - "plugins/**"
      - "CHANGELOG.md"
      - "breaking-changes.json"
      - "scripts/check-plugin.sh"
      - "scripts/check-breaking.sh"
      - ".github/workflows/plugin-guards.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: plugin-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payload-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Lint the scripts
        run: shellcheck --severity=warning scripts/check-plugin.sh scripts/check-breaking.sh

      - name: Check the plugin payload
        run: scripts/check-plugin.sh payload

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      # Full history and tags, so the breaking change check can list the
      # commits since the last plugin tag.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version and the changelog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-plugin.sh version "$BASE_SHA"

      - name: A breaking plugin change needs an entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          manifest=plugins/playbook/.claude-plugin/plugin.json
          head_v="$(jq -r '.version' "$manifest")"
          base_v="$(git show "$BASE_SHA:$manifest" | jq -r '.version')"
          if [ "$head_v" = "$base_v" ]; then
            echo "PASS the plugin version is unchanged at $head_v"
            exit 0
          fi
          scripts/check-breaking.sh release plugin "$head_v"
          scripts/check-breaking.sh changelog "$head_v"
