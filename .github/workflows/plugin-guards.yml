#
# Guards for the playbook plugin in plugins/playbook, which the marketplace
# serves as it is.
#   payload-guard: the directory holds only markdown and the manifest.
#   version-sync: the plugin version in plugin.json equals the workspace
#   version in Cargo.toml, and its minBinaryVersion is the X.Y.0 of that
#   minor line (ADR 0038). The binary and the plugin ship as one release
#   line, so a plugin change between releases needs no bump; the release
#   bumps all three.
# They run when the plugin, the versions, the changelog or the script changes,
# on a pull request and on a push to main.

name: plugin-guards

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "plugins/**"
      - "Cargo.toml"
      - "CHANGELOG.md"
      - "scripts/check-plugin.sh"
      - ".github/workflows/plugin-guards.yml"
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "Cargo.toml"
      - "scripts/check-plugin.sh"
      - ".github/workflows/plugin-guards.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: plugin-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payload-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Lint the script
        run: shellcheck --severity=warning scripts/check-plugin.sh

      - name: Check the plugin payload
        run: scripts/check-plugin.sh payload

  version-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: The binary and the plugin share one version
        run: scripts/check-plugin.sh version
