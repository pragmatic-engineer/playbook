#
# CI gate for the repo's own shell code. Runs on ubuntu-latest and macos-latest
# so the BSD code paths (date -j, stat -f, cp -c, md5) execute too. Validates:
#   - ShellCheck static analysis on all tracked .sh files (Linux only, lint once)
#   - Bash syntax (bash -n) on all tracked .sh files
#   - Zsh syntax (zsh -n) on all tracked .zsh files
#   - No personal identifier or maintainer-specific string in tracked files
#   - Every behavioral suite discovered via `git ls-files '*.test.sh'`

name: shell-ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: shell-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        # Linux-only action; it self-skips on macOS with a confusing warning.
        if: runner.os == 'Linux'
        with:
          # Kept on audit (not block) — apt-get pulls from Ubuntu archive
          # mirrors that rotate per runner placement (azure.archive.ubuntu.com,
          # security.ubuntu.com, esm.ubuntu.com, etc.). harden-runner has no
          # wildcard support so a strict block-mode allowlist would break when
          # the runner lands on a different mirror than the one sampled.
          # Audit mode still enforces the global blocklist of known-compromised
          # C2/exfil endpoints. Reassess if step-security adds wildcard support.
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install shellcheck, zsh, and jq
        # macOS runners ship zsh and jq; only Linux needs the apt install.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh jq

      - name: ShellCheck (.sh files)
        # Lint once, on Linux only: shellcheck is not preinstalled on macOS
        # runners and static analysis is platform-independent.
        # Stays at warning rather than style: of the 87 findings below warning
        # (measured 2026-08-18), most are deliberate idiom, and 7 are SC1091
        # which survives even `shellcheck -x`. Tightening would mean adding
        # disable directives, not fixing bugs.
        if: runner.os == 'Linux'
        run: git ls-files '*.sh' | xargs shellcheck --severity=warning

      - name: Bash syntax check
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done

      - name: Zsh syntax check
        run: |
          for f in $(git ls-files '*.zsh'); do zsh -n "$f"; done

      - name: Personal-identifier grep
        # Regression guard for everything S2-S4 of the product-hardening
        # wrap-up removed from the shipped surface (settings.shared.json,
        # permissions.shared.json, README.md, docs, Brewfile): a maintainer
        # home-directory convention, a Jira host, the `rtk` local CLI wrapper,
        # and the maintainer's own username. Excludes docs/adr/**: ADRs are
        # a historical record (ADR 0001/0002/0006 alone carry 10+ legitimate
        # references to `rtk` and `Workspace/` documenting real past
        # decisions), and rewriting history after the fact is wrong. A
        # further handful of test fixtures and doc-comments legitimately
        # reuse these strings to exercise or document real, intentional
        # product behaviour rather than leaking an identifier; each is
        # excluded by exact path below. This step's own file is also
        # excluded: its comments and its regex literal necessarily spell out
        # the very strings it searches for.
        run: |
          if git ls-files -- \
              ':!.github/workflows/shell-ci.yml' \
              ':!docs/adr/**' \
              ':!shell/ensure-deps.test.sh' \
              ':!shell/statusline.test.sh' \
              ':!src/hooks/rm_workspace_guard.rs' \
              ':!src/init/wire.rs' \
              ':!tests/fixtures/golden/setup-local.clean-install.json' \
              ':!tests/fixtures/golden/setup-local.skip-triggering.json' \
              ':!tests/hooks_guards.rs' \
              ':!tests/init_wire.rs' \
              ':!tests/settings_check.rs' \
              ':!tests/settings_gen.rs' \
              | xargs grep -nE 'Workspace/|atlassian\.net|\brtk\b|isantos'; then
            echo "::error::personal identifier or maintainer-specific string found in tracked files (see above)"
            exit 1
          fi

      - name: Run behavioral test suites
        # Discover every suite so a new *.test.sh is picked up automatically.
        # The git identity is needed by the worktree suites, which commit.
        #
        # Written to a THROWAWAY global config, never to a repo and never as
        # GIT_AUTHOR_*/GIT_COMMITTER_*.
        #
        # An unscoped `git config user.email` writes into the checked-out
        # repo's .git/config, harmless on an ephemeral runner but permanent
        # when the step is reproduced locally: on 2026-08-20 it rewrote a real
        # repo's identity and the next commit was authored by a user GitHub
        # cannot resolve, so its signature would not verify. `git config
        # --local` does not help, since that is already what an unscoped write
        # does.
        #
        # Environment variables are NOT the fix either. They sit ABOVE per-repo
        # config in git's precedence, so they override every fixture that sets
        # its own identity; that broke shell/worktree.test.sh scenario M.
        # GIT_CONFIG_GLOBAL keeps the identity at global precedence, which a
        # fixture's own `git config user.email` still beats, exactly as before.
        run: |
          GIT_CONFIG_GLOBAL="$(mktemp)"
          export GIT_CONFIG_GLOBAL
          git config --global user.email "ci@github.local"
          git config --global user.name "CI"
          for f in $(git ls-files '*.test.sh'); do
            echo "== $f"
            bash "$f" || exit 1
          done
