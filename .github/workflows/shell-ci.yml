#
# CI gate for the repo's own shell code. Runs on ubuntu-latest and macos-latest
# so the BSD code paths (date -j, stat -f, cp -c, md5) execute too. Validates:
#   - ShellCheck static analysis on all tracked .sh files (Linux only, lint once)
#   - Bash syntax (bash -n) on all tracked .sh files
#   - Zsh syntax (zsh -n) on all tracked .zsh files
#   - Shared settings template shape (shell/check-shared-settings.py)
#   - Tracked-file allowlist, no leaked runtime state (shell/check-manifest.sh)
#   - Agent definitions in agents/*.md (shell/check-agents.sh)
#   - Every behavioral suite discovered via `git ls-files '*.test.sh'`

name: shell-ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: shell-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        # Linux-only action; it self-skips on macOS with a confusing warning.
        if: runner.os == 'Linux'
        with:
          # Kept on audit (not block) — apt-get pulls from Ubuntu archive
          # mirrors that rotate per runner placement (azure.archive.ubuntu.com,
          # security.ubuntu.com, esm.ubuntu.com, etc.). harden-runner has no
          # wildcard support so a strict block-mode allowlist would break when
          # the runner lands on a different mirror than the one sampled.
          # Audit mode still enforces the global blocklist of known-compromised
          # C2/exfil endpoints. Reassess if step-security adds wildcard support.
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install shellcheck, zsh, and jq
        # macOS runners ship zsh and jq; only Linux needs the apt install.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh jq

      - name: ShellCheck (.sh files)
        # Lint once, on Linux only: shellcheck is not preinstalled on macOS
        # runners and static analysis is platform-independent.
        # --severity=warning: the baseline is clean at error and warning.
        # Dropping to --severity=style is NOT two fixes away, despite what this
        # comment used to claim. Measured 2026-08-18: 87 findings appear below
        # warning, and they are mostly not defects. 56 are SC2015 (A && B || C)
        # from the pass/fail idiom in the .test.sh files, 18 are SC2016 (single
        # quotes not expanding) which is the point of the quoting, and 7 are
        # SC1091 (cannot follow a sourced path), which survives even with
        # shellcheck -x, so no amount of source fixing clears it.
        # Tightening therefore means adding disable directives, not fixing bugs.
        # The findings that WERE real got fixed instead: SC2295 in statusline.sh
        # (unquoted $HOME read as a glob) and SC2223 in shell/shared/worktree.sh.
        if: runner.os == 'Linux'
        run: git ls-files '*.sh' | xargs shellcheck --severity=warning

      - name: Bash syntax check
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done

      - name: Zsh syntax check
        run: |
          for f in $(git ls-files '*.zsh'); do zsh -n "$f"; done

      - name: Python syntax check
        # Lint once, on Linux only: static checks are platform-independent,
        # no need to burn the macOS leg.
        if: runner.os == 'Linux'
        run: git ls-files '*.py' | xargs -r -n1 python3 -m py_compile

      - name: Python lint
        # Lint once, on Linux only: static checks are platform-independent,
        # no need to burn the macOS leg. Config (line-length ignore) lives
        # in ruff.toml.
        # Piped through `xargs -r` (not `ruff check $(...)`) so an empty file
        # list runs nothing. Bare `ruff check` lints the whole tree recursively,
        # so the substitution form silently widens to the entire repo the moment
        # the last tracked .py goes away, which WU-14 does on purpose.
        if: runner.os == 'Linux'
        run: git ls-files '*.py' | xargs -r pipx run ruff check

      - name: Validate shared settings, tracked-file manifest, and agent definitions
        run: |
          python3 shell/check-shared-settings.py settings.shared.json permissions.shared.json .
          bash shell/check-manifest.sh
          bash shell/check-agents.sh

      - name: Run behavioral test suites
        # Discover every suite so a new *.test.sh is picked up automatically.
        # The git identity is needed by the worktree suites, which commit.
        run: |
          git config user.email "ci@github.local"
          git config user.name "CI"
          for f in $(git ls-files '*.test.sh'); do
            echo "== $f"
            bash "$f" || exit 1
          done
