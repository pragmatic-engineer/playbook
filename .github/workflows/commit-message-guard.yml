#
# Removes AI attribution from a pull request's title and body. It never fails
# the pull request: when `playbook sanitize` would change the text, the job
# rewrites it with `gh pr edit`. The commit-message-sanitizer hook only sees an
# agent's Bash calls, so this is what catches text written any other way.
#
# Commit messages inside the branch are not edited here. A squash merge takes
# its message from the PR title and body (squash_merge_commit_title is
# PR_TITLE and squash_merge_commit_message is PR_BODY), so cleaning those is
# what keeps attribution out of the history on main.
#
# The sanitiser binary is built from the base commit, never from the PR, so a PR
# cannot change the rule that judges it. This workflow file itself runs as the
# PR has it, since the `pull_request` event reads it from the PR's merge commit:
# a PR that edits this file changes the steps, not the sanitiser. The title and
# body reach the job only through environment variables and files, never
# through the text of a command. A fork's token cannot edit the PR, so forks
# are skipped.

name: commit-message-guard

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions: {}

concurrency:
  group: commit-message-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sanitize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            objects.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      # Prints the version rust-toolchain.toml actually resolved to, same as
      # rust-ci.yml, so the job log shows the pin took effect.
      - name: rustc --version
        run: rustc --version

      - name: Build the sanitiser from the base commit
        run: cargo build --quiet

      - name: Sanitize the PR title and body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          bin="$PWD/target/debug/playbook"

          # The first PR that adds the command has a base without it.
          if ! "$bin" sanitize pr-text --help >/dev/null 2>&1; then
            echo "::notice title=commit-message-guard::the base commit has no sanitize command yet, so nothing was checked"
            exit 0
          fi

          work="$RUNNER_TEMP/pr-text"
          mkdir -p "$work"
          printf '%s' "$PR_TITLE" > "$work/title.txt"
          printf '%s' "$PR_BODY" > "$work/body.txt"

          changed=0
          edit=(gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY")
          for part in title body; do
            "$bin" sanitize pr-text "$work/$part.txt" --check 2> "$work/$part.report"
            status=$?
            if [ "$status" -eq 2 ]; then
              # Exit 1 means something would be removed; 2 means the file could not be read.
              echo "::warning title=commit-message-guard::the PR $part could not be read, so it was not checked"
            elif [ "$status" -ne 0 ]; then
              # The report names a line and a shape, never the text.
              sed "s/^/PR $part: /" "$work/$part.report"
              "$bin" sanitize pr-text "$work/$part.txt" 2> /dev/null
              if [ "$part" = title ] && [ -z "$(cat "$work/title.txt")" ]; then
                echo "::warning title=commit-message-guard::the PR title is only attribution, so it was left as it is; rename it"
              elif [ "$part" = title ]; then
                changed=1
                edit+=(--title "$(cat "$work/title.txt")")
              else
                changed=1
                edit+=(--body-file "$work/body.txt")
              fi
            fi
          done

          if [ "$changed" -eq 0 ]; then
            echo "Nothing to edit on the PR."
            exit 0
          fi
          if "${edit[@]}"; then
            echo "::notice title=commit-message-guard::removed AI attribution from the PR title or body"
          else
            echo "::warning title=commit-message-guard::could not edit the PR, so its title or body still carries AI attribution; edit it by hand"
          fi
