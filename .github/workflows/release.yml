# SPDX-License-Identifier: MIT
#
# WU-10 of ADR 0007. Attaches verified binaries to a release that already
# exists: releases are cut by pushing a signed annotated tag and then running
# `gh release create --target main`. This workflow does NOT create the release,
# it only builds, signs and uploads the artefacts plus SHA256SUMS.
#
# Five targets, built on the host that matches them:
#   aarch64-apple-darwin        macos-latest, native
#   x86_64-apple-darwin         macos-latest, cross
#   x86_64-unknown-linux-musl   ubuntu-latest, native musl-gcc + rust-lld
#   aarch64-unknown-linux-musl  ubuntu-24.04-arm, native musl-gcc + rust-lld
#   x86_64-pc-windows-msvc      windows-latest
#
# rusqlite's `bundled` feature compiles SQLite's C source (via
# libsqlite3-sys) and needs a real C compiler, unlike the rest of this
# crate graph (clap, serde, serde_json), which is why both musl legs below
# install `musl-tools` for a native `musl-gcc` and still link with
# rust-lld. Neither leg cross-compiles C code: this repo is public, so
# GitHub's arm64-hosted `ubuntu-24.04-arm` runner (GA since 2025-08, free
# for public repos) builds the aarch64 leg NATIVELY on real arm64 hardware
# instead of cross-compiling from an x86_64 host, the same way the
# aarch64-apple-darwin leg already builds natively on Apple Silicon. That
# sidesteps needing a musl cross C toolchain entirely, and both Linux legs
# use the exact same technique, verified in CI: container-smoke and
# container-smoke-arm64 both pass on real hardware, including a real
# `gate record`/`gate check` round trip through rusqlite (not just "the
# binary starts"). The aarch64-unknown-linux-musl leg here in release.yml
# specifically still hasn't run for real (this workflow only runs on a
# pushed tag or `workflow_dispatch`), but it uses no new mechanism beyond
# "install musl-tools, build", already proven on real arm64 hardware by
# container-smoke-arm64; watch its first run anyway, since the artefact
# upload and checksums steps below hard-require all 5 targets to succeed.
#
# Why `codesign --force`: on Apple Silicon the linker already ad-hoc signs the
# native binary, while the cross-built x86_64 one comes out "not signed at
# all". `--force` covers both cases in one step.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fail before spending five build legs on a version mismatch. The manifest
  # version is user-visible through `claude plugin details`, so a binary whose
  # version contradicts the manifest must never publish.
  verify-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Tag, Cargo.toml and plugin.json must agree
        id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          plugin_version="$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')"

          echo "tag:         $tag (version $tag_version)"
          echo "Cargo.toml:  $cargo_version"
          echo "plugin.json: $plugin_version"

          if [ "$tag_version" != "$cargo_version" ] || [ "$tag_version" != "$plugin_version" ]; then
            echo "::error::version mismatch: tag=$tag_version Cargo.toml=$cargo_version plugin.json=$plugin_version. All three must agree before publishing." >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            linker: rust-lld
            cc: musl-gcc
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            linker: rust-lld
            cc: musl-gcc
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        # Linux-only action; it self-skips elsewhere with a confusing warning
        # (same convention as rust-ci.yml and shell-ci.yml).
        if: runner.os == 'Linux'
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            objects.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            uploads.github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Install the musl C compiler
        # rusqlite's `bundled` feature compiles SQLite's C source and needs
        # a real C compiler.
        # `musl-tools` gives `musl-gcc`, which only ever targets the
        # runner's OWN arch, so this only works because both musl legs now
        # run on a same-arch runner (ubuntu-latest for x86_64,
        # ubuntu-24.04-arm for aarch64): neither leg cross-compiles C.
        if: matrix.cc == 'musl-gcc'
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        env:
          RELEASE_LINKER: ${{ matrix.linker }}
          RELEASE_CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_LINKER:-}" ]; then
            # Uppercase the target and swap dashes, per cargo's env var naming.
            tu="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
            export "CARGO_TARGET_${tu}_LINKER=${RELEASE_LINKER}"
          fi
          if [ -n "${RELEASE_CC:-}" ]; then
            # cc-rs's own env var convention: lowercase target, underscores
            # instead of dashes (distinct from cargo's CARGO_TARGET_* casing
            # above). Verified in CI on the x86_64 leg (container-smoke and
            # PRs #285-287).
            tc="$(echo '${{ matrix.target }}' | tr '-' '_')"
            export "CC_${tc}=${RELEASE_CC}"
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Ad-hoc sign the macOS binaries
        if: runner.os == 'macOS'
        run: codesign --sign - --force target/${{ matrix.target }}/release/playbook

      - name: Confirm the macOS signature is adhoc
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          codesign -dvv target/${{ matrix.target }}/release/playbook 2>&1 | tee /tmp/cs.txt
          grep -q 'Signature=adhoc' /tmp/cs.txt

      - name: Confirm the linux binaries are static
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          file -b target/${{ matrix.target }}/release/playbook | tee /tmp/f.txt
          grep -qE 'static-pie linked|statically linked' /tmp/f.txt

      - name: Name and upload the artefact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          set -euo pipefail
          asset="playbook-${VERSION}-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/playbook${{ matrix.ext }}" "$asset"
          # The release is created by the maintainer before this runs; see the
          # header. A missing release is a procedure error, not a build error,
          # so say so rather than failing on an opaque upload error.
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || {
            echo "::error::release ${GITHUB_REF_NAME} does not exist. Create it first with: gh release create ${GITHUB_REF_NAME} --target main" >&2
            exit 1
          }
          gh release upload "${GITHUB_REF_NAME}" "$asset" --clobber

  checksums:
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - name: Build SHA256SUMS from the uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify-version.outputs.version }}
          # This job never checks the repo out, so gh cannot infer the repo
          # from a git remote the way it does in the build jobs. Passing it
          # explicitly is cheaper than a checkout it has no other use for.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          # Download exactly the five binaries, never a previous SHA256SUMS.
          gh release download "${GITHUB_REF_NAME}" --pattern "playbook-${VERSION}-*" --clobber
          count="$(find . -type f | wc -l | tr -d ' ')"
          if [ "$count" -ne 5 ]; then
            echo "::error::expected 5 artefacts, found $count. Refusing to publish a partial SHA256SUMS." >&2
            find . -type f
            exit 1
          fi
          shasum -a 256 playbook-* > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          cat SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --clobber
