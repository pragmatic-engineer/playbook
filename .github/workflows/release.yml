#
# The playbook release (ADR 0038, ADR 0039). One run releases the binary, the
# plugin and pbtop under one version and one tag:
#
#   gh workflow run release.yml -f bump=patch     (or minor, or major)
#   gh workflow run release.yml -f version=X.Y.Z
#   gh workflow run release.yml -f bump=patch -f dry_run=true
#
# `plan` reads the versions on main and the v tags (scripts/release-plan.sh)
# and picks where to start, so a run that failed half way is run again with
# the same version and goes on from there:
#   prepare  open the release pull request with the bump and the changelog
#            section, and wait for it to merge through the merge queue;
#   tag      create the tag vX.Y.Z on the merged commit with the igorjs app
#            token, which the "Protect release tags" ruleset lets through;
#   publish  build the five targets, attach the assets to a draft release,
#            write SHA256SUMS, attest, publish the release as the latest,
#            then download it again and check it.
# Then `downstream` opens release/vX.Y.Z in pragmatic-engineer/homebrew-tap and
# pragmatic-engineer/marketplace and waits for their own vX.Y.Z releases.
# A published release is never built or uploaded again. A tag is never moved.
#
# Dry run: `dry_run=true` plans, shows the changes the release pull request
# and the downstream pull requests would make, checks the app tokens with
# read-only calls, and builds the five targets from main. It opens, tags,
# uploads and publishes nothing.
#
# Five targets, built on the host that matches them:
#   aarch64-apple-darwin        macos-latest, native
#   x86_64-apple-darwin         macos-latest, cross
#   x86_64-unknown-linux-musl   ubuntu-latest, native musl-gcc + rust-lld
#   aarch64-unknown-linux-musl  ubuntu-24.04-arm, native musl-gcc + rust-lld
#   x86_64-pc-windows-msvc      windows-latest
# Each target gives two assets: the raw `playbook` binary and
# pbtop-X.Y.Z-<target>.tar.gz with pbtop alone. The playbook-telemetry
# archive is retired (ADR 0041).
#
# rusqlite's `bundled` feature compiles SQLite's C source and needs a real C
# compiler, which is why both musl legs install `musl-tools` and still link
# with rust-lld. Neither leg cross-compiles C code. `codesign --force` covers
# the native macOS binary, which the linker already signs, and the cross-built
# one, which comes out unsigned.

name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch, minor or major. Leave empty when you give a version.'
        required: false
        type: string
        default: ''
      version:
        description: 'X.Y.Z to release, or to finish when a run stopped half way. Leave empty when you give a bump.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Plan, show the changes and build, without opening, tagging or publishing anything.'
        required: false
        type: boolean
        default: false

permissions: {}

# One release at a time, and a running release is never cancelled. GitHub
# keeps one pending run per group and cancels an older pending one, so dry
# runs have a group of their own and never replace a pending release.
concurrency:
  group: ${{ inputs.dry_run && 'release-dry-run' || 'release' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
      state: ${{ steps.plan.outputs.state }}
      commit: ${{ steps.plan.outputs.commit }}
      release: ${{ steps.plan.outputs.release }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -n "$BUMP" ] && [ -n "$VERSION" ]; then
            echo "::error::give a bump or a version, not both." >&2; exit 1
          fi
          want="${BUMP:-$VERSION}"
          [ -n "$want" ] || { echo "::error::give a bump (patch, minor, major) or a version." >&2; exit 1; }
          if [ "$DRY_RUN" != "true" ] && [ "$REF" != "$DEFAULT_REF" ]; then
            echo "::error::a release runs from $DEFAULT_REF. Use dry_run=true on another branch." >&2; exit 1
          fi
          scripts/release-plan.sh "$want" > "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan"
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/plan"
          # Only "release not found" counts as no release. Any other error
          # fails the plan, so a published release is never rebuilt.
          release=none
          if [ "$state" = publish ]; then
            release="$(scripts/release-gh.sh state "$GH_REPO" "$tag" | sed -n 's/^release=//p')"
            [ -n "$release" ] || { echo "::error::could not read the release $tag." >&2; exit 1; }
          fi
          build=true
          if [ "$release" = published ] && [ "$DRY_RUN" != "true" ]; then build=false; fi
          {
            cat "$RUNNER_TEMP/plan"
            echo "release=$release"
            echo "dry_run=$DRY_RUN"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan"
            echo
            echo "| version | previous | start at | GitHub release | dry run |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| $version | $previous | $state | $release | $DRY_RUN |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Opens the release pull request and waits for the merge queue to land it.
  # A pull request that is already open or merged is reused.
  prepare:
    needs: plan
    if: needs.plan.outputs.state == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.land.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write the release changes
        id: changes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          scripts/release-prepare.sh "$VERSION"
          git diff --name-only > "$RUNNER_TEMP/files"
          # The pull request body is the changelog section.
          awk -v h="## playbook $VERSION" '$0 == h { on = 1; next } on && /^## playbook / { exit } on' \
            CHANGELOG.md > "$RUNNER_TEMP/body.md"
          {
            echo "## Release pull request for $VERSION"
            echo
            echo '~~~diff'
            git diff
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: needs.plan.outputs.dry_run != 'true'
        id: app
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open the release pull request
        if: needs.plan.outputs.dry_run != 'true'
        id: open
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/files"
          scripts/release-gh.sh pr "$REPO" "release/v$VERSION" "chore(release): playbook $VERSION" \
            "$RUNNER_TEMP/body.md" . "${files[@]}" > "$RUNNER_TEMP/pr"
          cat "$RUNNER_TEMP/pr"
          pr="$(sed -n 's/^pr=//p' "$RUNNER_TEMP/pr")"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "Release pull request: https://github.com/$REPO/pull/$pr" >> "$GITHUB_STEP_SUMMARY"

      # GITHUB_TOKEN lasts for the whole job, and the app token only an hour.
      - name: Wait for the release pull request to merge
        if: needs.plan.outputs.dry_run != 'true'
        id: land
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.open.outputs.pr }}
        run: |
          set -euo pipefail
          scripts/release-gh.sh wait "$REPO" "$PR" 4800 | tee -a "$GITHUB_OUTPUT"

  # Creates vX.Y.Z on the commit that carries the version. When GitHub
  # refuses, the run stops with the command a maintainer runs instead.
  tag:
    needs: [plan, prepare]
    if: ${{ !cancelled() && !failure() && (needs.plan.outputs.state == 'prepare' || needs.plan.outputs.state == 'tag') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release commit
        id: commit
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          # The merge of the release pull request, or the commit the plan
          # found on main.
          SHA: ${{ needs.prepare.outputs.sha || needs.plan.outputs.commit }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "$SHA" ]; then
            [ "$DRY_RUN" = "true" ] || { echo "::error::no commit to tag for $VERSION." >&2; exit 1; }
            echo "A dry run has no release commit to tag."
            exit 0
          fi
          # The release pull request merged after the checkout, so fetch.
          git fetch --quiet origin "$MAIN"
          git checkout --quiet "$SHA"
          scripts/check-plugin.sh version
          [ "$(scripts/check-plugin.sh cargo-version)" = "$VERSION" ] \
            || { echo "::error::$SHA does not carry $VERSION." >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release commit: $SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: needs.plan.outputs.dry_run != 'true'
        id: app
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create the tag
        if: needs.plan.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          code=0
          scripts/release-gh.sh tag "$REPO" "$TAG" "$SHA" || code=$?
          if [ "$code" = 3 ]; then
            {
              echo "GitHub refused to create $TAG. A maintainer creates it instead, then runs this workflow again with version=$VERSION:"
              echo
              echo '```bash'
              echo "git fetch origin && git tag -s $TAG $SHA -m \"playbook $VERSION\" && git push origin $TAG"
              echo "gh workflow run release.yml -f version=$VERSION"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          exit "$code"

  # The draft release holds the assets until every check passes. A draft
  # left by a failed run is reused.
  draft:
    needs: [plan, tag]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.build == 'true' && needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create the draft release with its notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          scripts/release-notes.sh body playbook "$VERSION" release-notes.json > "$RUNNER_TEMP/notes.md"
          case "$(scripts/release-gh.sh state "$GH_REPO" "$TAG")" in
            release=none)
              gh release create "$TAG" --draft --verify-tag --title "playbook $VERSION" --notes-file "$RUNNER_TEMP/notes.md" ;;
            release=draft) echo "Reusing the draft $TAG." ;;
            *) echo "::error::$TAG is already published. Nothing is uploaded." >&2; exit 1 ;;
          esac
          gh release upload "$TAG" release-notes.json breaking-changes.json --clobber

  build:
    needs: [plan, draft]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            linker: rust-lld
            cc: musl-gcc
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            linker: rust-lld
            cc: musl-gcc
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        # Linux-only action; it skips itself elsewhere.
        if: runner.os == 'Linux'
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            archive.ubuntu.com:443
            azure.archive.ubuntu.com:80
            crates.io:443
            fulcio.githubapp.com:443
            fulcio.sigstore.dev:443
            github.com:443
            index.crates.io:443
            objects.githubusercontent.com:443
            rekor.sigstore.dev:443
            security.ubuntu.com:443
            static.crates.io:443
            static.rust-lang.org:443
            timestamp.githubapp.com:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            uploads.github.com:443

      # The tag, or main on a dry run.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.plan.outputs.dry_run == 'true' && github.sha || needs.plan.outputs.tag }}
          persist-credentials: false

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Install the musl C compiler
        if: matrix.cc == 'musl-gcc'
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        env:
          RELEASE_LINKER: ${{ matrix.linker }}
          RELEASE_CC: ${{ matrix.cc }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_LINKER:-}" ]; then
            tu="$(echo "$TARGET" | tr 'a-z-' 'A-Z_')"
            export "CARGO_TARGET_${tu}_LINKER=${RELEASE_LINKER}"
          fi
          if [ -n "${RELEASE_CC:-}" ]; then
            tc="$(echo "$TARGET" | tr '-' '_')"
            export "CC_${tc}=${RELEASE_CC}"
          fi
          cargo build --release --locked -p playbook -p playbook-telemetry --bin playbook --bin pbtop --target "$TARGET"

      - name: Ad-hoc sign the macOS binaries
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for b in playbook pbtop; do
            codesign --sign - --force "target/$TARGET/release/$b"
            codesign -dvv "target/$TARGET/release/$b" 2>&1 | grep -q 'Signature=adhoc'
          done

      - name: Confirm the linux binaries are static
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for b in playbook pbtop; do
            file -b "target/$TARGET/release/$b" | grep -qE 'static-pie linked|statically linked'
          done

      - name: Name the assets
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          dir="target/$TARGET/release"
          mkdir -p dist
          # Each binary must run and report the version, before anything is
          # uploaded. A dry run builds main, which still has the version
          # before the release. The x86_64 macOS binary is cross built and
          # cannot run on the arm64 runner.
          want="$VERSION"
          if [ "$DRY_RUN" = true ]; then want="$(scripts/check-plugin.sh cargo-version)"; fi
          if [ "$TARGET" != x86_64-apple-darwin ]; then
            for b in playbook pbtop; do
              out="$("$dir/$b$EXT" --version)"
              [ "${out##* }" = "$want" ] \
                || { echo "::error::$b --version says '$out', not $want." >&2; exit 1; }
            done
          fi
          cp "$dir/playbook$EXT" "dist/playbook-$VERSION-$TARGET$EXT"
          tar -czf "dist/pbtop-$VERSION-$TARGET.tar.gz" -C "$dir" "pbtop$EXT"
          cd dist
          if command -v shasum >/dev/null 2>&1; then shasum -a 256 ./*; else sha256sum ./*; fi

      # The attestation covers the bytes this leg built. Publish checks each
      # draft asset against it, so an asset changed in the draft is caught.
      - name: Attest the assets
        if: needs.plan.outputs.dry_run != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload the assets to the draft
        if: needs.plan.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          [ "$(scripts/release-gh.sh state "$GH_REPO" "$TAG")" = release=draft ] \
            || { echo "::error::$TAG is not a draft. Nothing is uploaded." >&2; exit 1; }
          gh release upload "$TAG" dist/* --clobber

  # SHA256SUMS, attestation and publish. The sums list every asset of the
  # release, and the release turns public only after they are attached.
  publish:
    needs: [plan, build]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.build == 'true' && needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.githubapp.com:443
            fulcio.sigstore.dev:443
            tuf-repo.github.com:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.githubapp.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            uploads.github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false

      - name: Build SHA256SUMS from the draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [ "$(scripts/release-gh.sh state "$GH_REPO" "$TAG")" = release=draft ] \
            || { echo "::error::$TAG is not a draft. Nothing is published." >&2; exit 1; }
          mkdir -p dist && cd dist
          for p in "playbook-$VERSION-*" "pbtop-$VERSION-*"; do
            gh release download "$TAG" --pattern "$p" --clobber
          done
          count="$(find . -type f | wc -l | tr -d ' ')"
          if [ "$count" -ne 10 ]; then
            echo "::error::expected 10 assets, found $count. Refusing to publish a partial release." >&2
            find . -type f
            exit 1
          fi
          # Each asset must carry the attestation its build leg made. A fetch
          # failure, a missing attestation and a mismatch each get their own
          # message.
          for f in playbook-* pbtop-*; do
            if ! err="$(gh attestation verify "$f" --repo "$GH_REPO" --source-ref "$SOURCE_REF" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" 2>&1 >/dev/null)"; then
              echo "$err" >&2
              # gh may wrap "no attestations found" in a fetch error, so it is
              # matched first.
              if grep -qi 'no attestations found' <<<"$err"; then
                echo "::error::$f has no attestation. Nothing is published." >&2
              elif grep -qiE 'failed to fetch|HTTP [0-9]{3}|dial tcp|no such host|i/o timeout|connection (refused|reset)|deadline exceeded' <<<"$err"; then
                echo "::error::could not fetch the attestation of $f, so it was not checked. Nothing is published." >&2
              else
                echo "::error::$f does not match the attestation of its build. Nothing is published." >&2
              fi
              exit 1
            fi
          done
          gh release download "$TAG" --pattern release-notes.json --clobber
          gh release download "$TAG" --pattern breaking-changes.json --clobber
          shasum -a 256 playbook-* pbtop-* release-notes.json breaking-changes.json > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release-notes.json
            dist/breaking-changes.json
            dist/SHA256SUMS

      - name: Publish the release as the latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          echo "Published: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

  # Downloads the published release the way users do and checks it.
  verify:
    needs: [plan, publish]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo.github.com:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Check the checksums, the attestations and the versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false ] \
            || { echo "::error::$TAG is still a draft." >&2; exit 1; }
          [ "$(gh release view --json tagName --jq .tagName)" = "$TAG" ] \
            || echo "::warning::$TAG is not the latest release."
          mkdir -p check && cd check
          gh release download "$TAG"
          sha256sum -c SHA256SUMS
          for f in playbook-* pbtop-* release-notes.json breaking-changes.json SHA256SUMS; do
            gh attestation verify "$f" --repo "$GH_REPO" --source-ref "$SOURCE_REF" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" >/dev/null
          done
          t=x86_64-unknown-linux-musl
          chmod +x "playbook-$VERSION-$t"
          mkdir -p pb
          tar -xzf "pbtop-$VERSION-$t.tar.gz" -C pb
          for bin in "./playbook-$VERSION-$t" pb/pbtop; do
            out="$("$bin" --version)"
            [ "${out##* }" = "$VERSION" ] \
              || { echo "::error::$bin --version says '$out', not $VERSION." >&2; exit 1; }
            echo "$bin: $out"
          done
          echo "Checked $(wc -l < SHA256SUMS) assets, their attestations and the versions." >> "$GITHUB_STEP_SUMMARY"

  # Writes the tap formulas with the tap's own bump script (ADR 0039 decision
  # 9). This job has no secrets, so code from the tap never runs next to an
  # app token. The formulas go to `downstream` as job outputs.
  formulas:
    needs: [plan, build, verify]
    if: >-
      ${{ !cancelled()
      && github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && needs.plan.result == 'success'
      && (needs.verify.result == 'success'
          || (needs.plan.outputs.dry_run == 'true' && needs.build.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      playbook: ${{ steps.write.outputs.playbook }}
      pbtop: ${{ steps.write.outputs.pbtop }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: pragmatic-engineer/homebrew-tap
          path: downstream/tap
          persist-credentials: false

      # The bump script reads the release's SHA256SUMS. A dry run has no
      # published release, so it reads a stand-in whose checksums are
      # placeholders.
      - name: Write the formulas
        id: write
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            sums="$RUNNER_TEMP/sums"
            mkdir -p "$sums"
            for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
              for a in "playbook-$VERSION-$t" "pbtop-$VERSION-$t.tar.gz"; do
                printf '%s  %s\n' "$(printf '%s' "$a" | sha256sum | cut -d' ' -f1)" "$a"
              done
            done > "$sums/SHA256SUMS"
            export DOWNLOAD_BASE="file://$sums"
          fi
          # The tap retires playbook-telemetry (ADR 0041), so it is not bumped.
          for f in playbook pbtop; do
            (cd downstream/tap && SOURCE_REPO=playbook TAG_PREFIX=v \
              .github/scripts/bump-formula.sh "$VERSION" "Formula/$f.rb")
          done
          {
            echo "playbook=$(base64 -w0 < downstream/tap/Formula/playbook.rb)"
            echo "pbtop=$(base64 -w0 < downstream/tap/Formula/pbtop.rb)"
          } >> "$GITHUB_OUTPUT"

  # Moves the Homebrew tap and the marketplace to the release (ADR 0039
  # decision 9). Each gets a release/vX.Y.Z pull request from the app with
  # auto-merge, and each tags and publishes its own vX.Y.Z when it merges. The
  # job opens both pull requests, then waits up to 30 minutes for them. When a
  # repository does not publish its release within five minutes of its merge,
  # the job tags and releases it through the API. A failure here leaves the
  # playbook release published: the job fails with the commands to finish by
  # hand. A dry run prints the changes and opens nothing.
  downstream:
    needs: [plan, formulas]
    if: >-
      ${{ !cancelled()
      && github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && needs.formulas.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TAP: pragmatic-engineer/homebrew-tap
      MARKETPLACE: pragmatic-engineer/marketplace
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Only files are read from these checkouts. No code from them runs here.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: pragmatic-engineer/homebrew-tap
          path: downstream/tap
          persist-credentials: false

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: pragmatic-engineer/marketplace
          path: downstream/marketplace
          persist-credentials: false

      - name: Write the changes
        env:
          PLAYBOOK_RB: ${{ needs.formulas.outputs.playbook }}
          PBTOP_RB: ${{ needs.formulas.outputs.pbtop }}
        run: |
          set -euo pipefail
          base64 -d <<<"$PLAYBOOK_RB" > downstream/tap/Formula/playbook.rb
          base64 -d <<<"$PBTOP_RB" > downstream/tap/Formula/pbtop.rb
          git -C downstream/tap add -A
          git -C downstream/tap diff --cached --name-only > "$RUNNER_TEMP/tap-files"

          # Exactly one playbook entry with a source object, so the pin cannot
          # miss and leave the plugin on the default branch.
          m=downstream/marketplace/.claude-plugin/marketplace.json
          jq -e '[.plugins[] | select(.name == "playbook" and (.source | type) == "object")] | length == 1' "$m" >/dev/null \
            || { echo "::error::$m does not have exactly one playbook entry with a source." >&2; exit 1; }
          jq --arg tag "$TAG" --arg v "$VERSION" \
            '(.plugins[] | select(.name == "playbook") | .source.ref) = $tag | .metadata.version = $v' \
            "$m" > "$RUNNER_TEMP/marketplace.json"
          cp "$RUNNER_TEMP/marketplace.json" "$m"
          jq -e --arg tag "$TAG" 'any(.plugins[]; .name == "playbook" and .source.ref == $tag)' "$m" >/dev/null
          git -C downstream/marketplace add -A
          git -C downstream/marketplace diff --cached --name-only > "$RUNNER_TEMP/marketplace-files"

          title="chore(release): playbook $VERSION"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          printf 'Moves playbook and pbtop to %s, with the URLs and checksums from the SHA256SUMS of %s.\n\nOpened by the playbook release workflow. It merges once the checks pass, and the release-tag workflow then tags this repository %s.\n' \
            "$VERSION" "$url" "$TAG" > "$RUNNER_TEMP/tap-body.md"
          printf 'Pins the playbook plugin to the release %s.\n\nOpened by the playbook release workflow. It merges once the checks pass, and the release workflow then tags this repository %s.\n' \
            "$url" "$TAG" > "$RUNNER_TEMP/marketplace-body.md"
          echo "title=$title" >> "$GITHUB_ENV"
          {
            echo "## Downstream changes for $TAG"
            [ "$DRY_RUN" != true ] || echo "Dry run: the formula checksums are placeholders, and nothing is opened."
            for repo in tap marketplace; do
              echo
              echo "### $repo: \`$title\` on \`release/$TAG\`"
              echo
              echo '~~~diff'
              git -C "downstream/$repo" diff --cached
              echo '~~~'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Read through env, so the values never appear in the script. Without
      # the secrets the job stops here with a notice.
      - name: Check for the app credentials
        id: bot
        env:
          BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
          BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$BOT_APP_CLIENT_ID" ] && [ -n "$BOT_APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice::BOT_APP_CLIENT_ID or BOT_APP_PRIVATE_KEY is not set, so the tap and the marketplace are not moved to $TAG."
          {
            echo "## Downstream skipped"
            echo
            echo "The app secrets are not set. Move the tap and the marketplace to $TAG by hand, as the release doc says, or set the secrets and run \`gh workflow run release.yml -f version=$VERSION\` again."
          } >> "$GITHUB_STEP_SUMMARY"

      # One token per repository. A dry run asks for read access only and
      # makes read calls, which checks the secrets and the installation.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.bot.outputs.configured == 'true'
        id: tap-app
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: pragmatic-engineer
          repositories: homebrew-tap
          permission-contents: ${{ needs.plan.outputs.dry_run == 'true' && 'read' || 'write' }}
          permission-pull-requests: ${{ needs.plan.outputs.dry_run == 'true' && 'read' || 'write' }}

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.bot.outputs.configured == 'true'
        id: marketplace-app
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: pragmatic-engineer
          repositories: marketplace
          permission-contents: ${{ needs.plan.outputs.dry_run == 'true' && 'read' || 'write' }}
          permission-pull-requests: ${{ needs.plan.outputs.dry_run == 'true' && 'read' || 'write' }}

      - name: Check the app tokens
        if: steps.bot.outputs.configured == 'true' && needs.plan.outputs.dry_run == 'true'
        env:
          TAP_TOKEN: ${{ steps.tap-app.outputs.token }}
          MARKETPLACE_TOKEN: ${{ steps.marketplace-app.outputs.token }}
        run: |
          set -euo pipefail
          GH_TOKEN="$TAP_TOKEN" gh api "repos/$TAP" --jq '"\(.full_name): pull: \(.permissions.pull // false)"'
          GH_TOKEN="$TAP_TOKEN" scripts/release-gh.sh find "$TAP" "release/$TAG"
          GH_TOKEN="$MARKETPLACE_TOKEN" gh api "repos/$MARKETPLACE" --jq '"\(.full_name): pull: \(.permissions.pull // false)"'
          GH_TOKEN="$MARKETPLACE_TOKEN" scripts/release-gh.sh find "$MARKETPLACE" "release/$TAG"

      - name: Open the pull requests and wait for the releases
        if: steps.bot.outputs.configured == 'true' && needs.plan.outputs.dry_run != 'true'
        env:
          TAP_TOKEN: ${{ steps.tap-app.outputs.token }}
          MARKETPLACE_TOKEN: ${{ steps.marketplace-app.outputs.token }}
        run: |
          set -euo pipefail
          end=$(( $(date +%s) + 1800 ))
          left() { local s=$(( end - $(date +%s) )); [ "$s" -gt 0 ] && echo "$s" || echo 0; }
          # Messages go to the log and the summary. Stdout carries results.
          report() { echo "$1" >&2; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          failed=0
          manual() {
            failed=1
            echo "::error::$1" >&2
            {
              echo
              echo "$1 Finish it by hand, then check that $2 has the release $TAG:"
              echo
              echo '```bash'
              echo "gh pr list --repo $2 --head release/$TAG --state all"
              echo "gh workflow run release.yml --repo $GITHUB_REPOSITORY -f version=$VERSION"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Opens or reuses release/$TAG in <repo>. Prints pr=<number>, or
          # sha=<head of the checkout> when the repository already carries
          # the release and there is no pull request.
          open_pr() {
            local repo="$1" dir="$2" files="$3" body="$4" out
            mapfile -t list < "$files"
            if [ "${#list[@]}" -gt 0 ]; then
              scripts/release-gh.sh pr "$repo" "release/$TAG" "$title" "$body" "$dir" "${list[@]}" | grep '^pr='
              return
            fi
            out="$(scripts/release-gh.sh find "$repo" "release/$TAG")" || return 1
            if grep -q '^pr=' <<<"$out"; then
              grep '^pr=' <<<"$out"
            else
              echo "sha=$(git -C "$dir" rev-parse HEAD)"
            fi
          }

          # The previous playbook ref in the marketplace, read from the parent
          # of <sha>, so a rerun writes the same notes.
          marketplace_notes() {
            local sha="$1" parent before
            parent="$(gh api "repos/$MARKETPLACE/commits/$sha" --jq '.parents[0].sha')"
            before="$(gh api -H 'Accept: application/vnd.github.raw' \
              "repos/$MARKETPLACE/contents/.claude-plugin/marketplace.json?ref=$parent" \
              | jq -r '.plugins[] | select(.name == "playbook") | .source.ref // "the default branch"')"
            printf 'playbook %s -> %s.\n' "$before" "$TAG"
          }

          # Waits for the pull request of <repo>, then up to five minutes for
          # the release the repository publishes itself. When it does not,
          # this tags the merge commit and publishes the release through the
          # API, but only when the commit changes nothing outside <allowed>,
          # the rule of the repository's own workflow.
          finish() {
            local repo="$1" opened="$2" allowed="$3" sha st="" stop other
            case "$opened" in
              pr=*)
                report "Pull request: https://github.com/$repo/pull/${opened#pr=}"
                sha="$(scripts/release-gh.sh wait "$repo" "${opened#pr=}" "$(left)" | sed -n 's/^sha=//p')" || return 1 ;;
              sha=*)
                report "$repo already carries $TAG, so it needs no pull request."
                sha="${opened#sha=}" ;;
            esac
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || return 1
            stop=$(( $(date +%s) + 300 ))
            while :; do
              st="$(scripts/release-gh.sh state "$repo" "$TAG")" || return 1
              [ "$st" = release=none ] || break
              [ "$(date +%s)" -lt "$stop" ] || break
              sleep 20
            done
            case "$st" in
              release=published) ;;
              release=draft) report "$repo has a draft release $TAG. Publish or delete it."; return 1 ;;
              *)
                other="$(gh api "repos/$repo/commits/$sha" --jq '.files[].filename' | grep -Ev "$allowed" || true)"
                if [ -n "$other" ]; then
                  report "$sha in $repo changes more than the release files (${other//$'\n'/ }), so it is not tagged."
                  return 1
                fi
                report "$repo did not publish $TAG itself, so this run tags $sha and publishes it."
                if [ "$repo" = "$MARKETPLACE" ]; then
                  marketplace_notes "$sha" > "$RUNNER_TEMP/notes.md"
                else
                  printf 'Formula versions for playbook %s: playbook and pbtop at %s.\n' "$TAG" "$VERSION" > "$RUNNER_TEMP/notes.md"
                fi
                scripts/release-gh.sh tag "$repo" "$TAG" "$sha" >/dev/null || return 1
                scripts/release-gh.sh release "$repo" "$TAG" "$TAG" "$RUNNER_TEMP/notes.md" >/dev/null || return 1 ;;
            esac
            report "Release: https://github.com/$repo/releases/tag/$TAG"
          }

          echo "## Downstream releases" >> "$GITHUB_STEP_SUMMARY"
          # Both pull requests open first, so their checks run at the same time.
          tap="" market=""
          tap="$(GH_TOKEN="$TAP_TOKEN" open_pr "$TAP" downstream/tap "$RUNNER_TEMP/tap-files" "$RUNNER_TEMP/tap-body.md")" \
            || manual "The tap pull request for $TAG could not be opened. The log says why." "$TAP"
          market="$(GH_TOKEN="$MARKETPLACE_TOKEN" open_pr "$MARKETPLACE" downstream/marketplace "$RUNNER_TEMP/marketplace-files" "$RUNNER_TEMP/marketplace-body.md")" \
            || manual "The marketplace pull request for $TAG could not be opened. The log says why." "$MARKETPLACE"
          if [ -n "$tap" ]; then
            GH_TOKEN="$TAP_TOKEN" finish "$TAP" "$tap" '^Formula/[a-z-]+\.rb$' \
              || manual "The tap release $TAG did not finish. The log says why." "$TAP"
          fi
          if [ -n "$market" ]; then
            GH_TOKEN="$MARKETPLACE_TOKEN" finish "$MARKETPLACE" "$market" '^\.claude-plugin/marketplace\.json$' \
              || manual "The marketplace release $TAG did not finish. The log says why." "$MARKETPLACE"
          fi
          if [ "$failed" -ne 0 ]; then
            report "The playbook release $TAG is published. Only the downstream step failed."
            exit 1
          fi
