#
# One release workflow for every tool in this repository (ADR 0029). A release
# is cut by pushing a signed annotated tag, and the tag prefix picks the tool:
#   vX.Y.Z            playbook            raw binaries
#   telemetry-vX.Y.Z  playbook-telemetry  .tar.gz holding playbook-telemetry and pbtop
#   code-vX.Y.Z       playbook-code       reserved, fails until crates/code has a binary
# The first job, `resolve`, maps the prefix to the package, binaries, archive
# shape and tool name and fails on any other tag.
#
# The workflow creates the GitHub release for the tag when it does not exist,
# then builds, ad hoc codesigns and uploads the artefacts plus SHA256SUMS, and
# attests their build provenance. Releases for telemetry-v and code-v tags are
# created with `--latest=false`, so GitHub's "latest release" stays on the
# playbook `vX.Y.Z` line that install.sh reads.
#
# Dry run: `workflow_dispatch` with a `tag` input and `dry_run` left on runs
# resolve, verify-version and the five builds, and skips release creation,
# uploads, checksums and attestation.
# A dispatch can never publish: publishing needs a pushed tag.
#
# Five targets, built on the host that matches them:
#   aarch64-apple-darwin        macos-latest, native
#   x86_64-apple-darwin         macos-latest, cross
#   x86_64-unknown-linux-musl   ubuntu-latest, native musl-gcc + rust-lld
#   aarch64-unknown-linux-musl  ubuntu-24.04-arm, native musl-gcc + rust-lld
#   x86_64-pc-windows-msvc      windows-latest
#
# rusqlite's `bundled` feature compiles SQLite's C source (via
# libsqlite3-sys) and needs a real C compiler, which is why both musl legs
# install `musl-tools` for a native `musl-gcc` and still link with rust-lld.
# Neither leg cross-compiles C code: the arm64-hosted `ubuntu-24.04-arm`
# runner builds the aarch64 leg natively, the same way the aarch64-apple-darwin
# leg builds natively on Apple Silicon. rust-ci.yml's container-smoke matrix
# job runs both musl legs on real hardware.
#
# Why `codesign --force`: on Apple Silicon the linker already ad-hoc signs the
# native binary, while the cross-built x86_64 one comes out "not signed at
# all". `--force` covers both cases in one step.

name: release

on:
  push:
    tags: ['v*', 'telemetry-v*', 'code-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to resolve and build, for example v0.26.0 or telemetry-v0.2.0. Its version must match the files on the selected ref.'
        required: true
        type: string
      dry_run:
        description: 'Build only: no release, upload or attestation. A dispatch is always a dry run.'
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Map the tag prefix to what gets built and released, and fail on any tag
  # that is not one of ours. Every later job reads these outputs, so the
  # prefix rules live in one place. The tag reaches the script through the
  # environment, never through the script text.
  resolve:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.map.outputs.tag }}
      version: ${{ steps.map.outputs.version }}
      package: ${{ steps.map.outputs.package }}
      bins: ${{ steps.map.outputs.bins }}
      archive: ${{ steps.map.outputs.archive }}
      cargo_toml: ${{ steps.map.outputs.cargo_toml }}
      tool: ${{ steps.map.outputs.tool }}
      latest_flag: ${{ steps.map.outputs.latest_flag }}
      is_playbook: ${{ steps.map.outputs.is_playbook }}
      dry_run: ${{ steps.map.outputs.dry_run }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Map the tag prefix
        id: map
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            dry_run=true
            if [ "$INPUT_DRY_RUN" != "true" ]; then
              echo "::error::a manual run is always a dry run. Push a signed tag to publish." >&2
              exit 1
            fi
          else
            tag="$REF_NAME"
            dry_run=false
          fi

          case "$tag" in
            telemetry-v[0-9]*)
              prefix="telemetry-v"; package="playbook-telemetry"
              bins="playbook-telemetry pbtop"; archive="tar"
              cargo_toml="crates/telemetry/Cargo.toml"
              tool="playbook-telemetry"; latest_flag="--latest=false"; is_playbook=false
              ;;
            code-v[0-9]*)
              echo "::error::code-v tags are reserved. crates/code has no binary yet, so there is nothing to release." >&2
              exit 1
              ;;
            v[0-9]*)
              prefix="v"; package="playbook"
              bins="playbook"; archive="raw"
              cargo_toml="Cargo.toml"
              tool="playbook"; latest_flag=""; is_playbook=true
              ;;
            *)
              echo "::error::unknown tag '${tag}'. Expected vX.Y.Z or telemetry-vX.Y.Z." >&2
              exit 1
              ;;
          esac

          version="${tag#"$prefix"}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${tag}' does not end in a plain X.Y.Z version." >&2
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "package=${package}"
            echo "bins=${bins}"
            echo "archive=${archive}"
            echo "cargo_toml=${cargo_toml}"
            echo "tool=${tool}"
            echo "latest_flag=${latest_flag}"
            echo "is_playbook=${is_playbook}"
            echo "dry_run=${dry_run}"
          } >> "$GITHUB_OUTPUT"
          echo "tag ${tag} resolves to package ${package}, dry run ${dry_run}"

  # Fail before spending five build legs on a version mismatch: the tag and
  # the tool's Cargo.toml must agree before anything publishes.
  verify-version:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Tag and Cargo.toml must agree
        id: check
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          TAG_VERSION: ${{ needs.resolve.outputs.version }}
          CARGO_TOML: ${{ needs.resolve.outputs.cargo_toml }}
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' "$CARGO_TOML" | head -1)"
          echo "tag:         $TAG (version $TAG_VERSION)"
          echo "$CARGO_TOML:  $cargo_version"

          if [ "$TAG_VERSION" != "$cargo_version" ]; then
            echo "::error::version mismatch: tag=$TAG_VERSION $CARGO_TOML=$cargo_version. Both must agree before publishing." >&2
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      # A dry run never creates the release, so show what the body of a plain
      # vX.Y.Z release would start with. The create-release job puts the same
      # file above the generated notes.
      - name: Show the release notes preview on a dry run
        if: needs.resolve.outputs.dry_run == 'true' && needs.resolve.outputs.is_playbook == 'true'
        run: |
          set -euo pipefail
          {
            echo "## Release body preview"
            echo
            echo "The body starts with .github/release-notes-upgrade.md, then the generated notes follow."
            echo
            echo '~~~markdown'
            cat .github/release-notes-upgrade.md
            echo '~~~'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Create the release for the tag when it is missing, so a pushed tag is all a
  # maintainer has to do. Releases for tools other than playbook are created
  # with --latest=false, which keeps the playbook vX.Y.Z release as the
  # repository's latest. --verify-tag refuses to create a tag implicitly.
  create-release:
    needs: [resolve, verify-version]
    if: needs.resolve.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create the release when it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TOOL: ${{ needs.resolve.outputs.tool }}
          LATEST_FLAG: ${{ needs.resolve.outputs.latest_flag }}
          IS_PLAYBOOK: ${{ needs.resolve.outputs.is_playbook }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          args=("$TAG" --verify-tag --title "$TOOL $VERSION")
          if [ -n "$LATEST_FLAG" ]; then
            args+=("$LATEST_FLAG")
          fi
          if [ "$IS_PLAYBOOK" = "true" ]; then
            # The upgrade note goes above the generated notes.
            args+=(--notes-file .github/release-notes-upgrade.md --generate-notes)
          else
            args+=(--notes "Release of $TOOL $VERSION. The archives below hold both binaries for each platform, and SHA256SUMS lists their checksums.")
          fi
          gh release create "${args[@]}"

  build:
    needs: [resolve, verify-version, create-release]
    # create-release is skipped on a dry run; any other outcome stops the build.
    if: ${{ !cancelled() && needs.verify-version.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            linker: rust-lld
            cc: musl-gcc
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            linker: rust-lld
            cc: musl-gcc
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        # Linux-only action; it self-skips elsewhere with a confusing warning
        # (same convention as rust-ci.yml and shell-ci.yml).
        if: runner.os == 'Linux'
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            archive.ubuntu.com:443
            azure.archive.ubuntu.com:80
            crates.io:443
            github.com:443
            index.crates.io:443
            objects.githubusercontent.com:443
            security.ubuntu.com:443
            static.crates.io:443
            static.rust-lang.org:443
            uploads.github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Install the musl C compiler
        # rusqlite's `bundled` feature compiles SQLite's C source and needs
        # a real C compiler.
        # `musl-tools` gives `musl-gcc`, which only ever targets the
        # runner's OWN arch, so this only works because both musl legs now
        # run on a same-arch runner (ubuntu-latest for x86_64,
        # ubuntu-24.04-arm for aarch64): neither leg cross-compiles C.
        if: matrix.cc == 'musl-gcc'
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        env:
          RELEASE_LINKER: ${{ matrix.linker }}
          RELEASE_CC: ${{ matrix.cc }}
          PACKAGE: ${{ needs.resolve.outputs.package }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_LINKER:-}" ]; then
            # Uppercase the target and swap dashes, per cargo's env var naming.
            tu="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
            export "CARGO_TARGET_${tu}_LINKER=${RELEASE_LINKER}"
          fi
          if [ -n "${RELEASE_CC:-}" ]; then
            # cc-rs's own env var convention: lowercase target, underscores
            # instead of dashes (distinct from cargo's CARGO_TARGET_* casing
            # above). Verified in CI on the x86_64 leg (container-smoke and
            # PRs #285-287).
            tc="$(echo '${{ matrix.target }}' | tr '-' '_')"
            export "CC_${tc}=${RELEASE_CC}"
          fi
          cargo build --release -p "$PACKAGE" --target ${{ matrix.target }}

      - name: Ad-hoc sign the macOS binaries
        if: runner.os == 'macOS'
        env:
          BINS: ${{ needs.resolve.outputs.bins }}
        run: |
          set -euo pipefail
          read -ra bins <<< "$BINS"
          for b in "${bins[@]}"; do codesign --sign - --force "target/${{ matrix.target }}/release/$b"; done

      - name: Confirm the macOS signature is adhoc
        if: runner.os == 'macOS'
        env:
          BINS: ${{ needs.resolve.outputs.bins }}
        run: |
          set -euo pipefail
          read -ra bins <<< "$BINS"
          for b in "${bins[@]}"; do
            codesign -dvv "target/${{ matrix.target }}/release/$b" 2>&1 | tee /tmp/cs.txt
            grep -q 'Signature=adhoc' /tmp/cs.txt
          done

      - name: Confirm the linux binaries are static
        if: runner.os == 'Linux'
        env:
          BINS: ${{ needs.resolve.outputs.bins }}
        run: |
          set -euo pipefail
          read -ra bins <<< "$BINS"
          for b in "${bins[@]}"; do
            file -b "target/${{ matrix.target }}/release/$b" | tee /tmp/f.txt
            grep -qE 'static-pie linked|statically linked' /tmp/f.txt
          done

      - name: Name the artefact
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TOOL: ${{ needs.resolve.outputs.tool }}
          BINS: ${{ needs.resolve.outputs.bins }}
          ARCHIVE: ${{ needs.resolve.outputs.archive }}
        run: |
          set -euo pipefail
          dir="target/${{ matrix.target }}/release"
          if [ "$ARCHIVE" = "tar" ]; then
            # One archive per target holding every binary of the tool.
            asset="${TOOL}-${VERSION}-${{ matrix.target }}.tar.gz"
            files=()
            read -ra bins <<< "$BINS"
            for b in "${bins[@]}"; do files+=("${b}${{ matrix.ext }}"); done
            tar -czf "$asset" -C "$dir" "${files[@]}"
          else
            asset="${TOOL}-${VERSION}-${{ matrix.target }}${{ matrix.ext }}"
            cp "${dir}/${TOOL}${{ matrix.ext }}" "$asset"
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          if command -v shasum >/dev/null 2>&1; then shasum -a 256 "$asset"; else sha256sum "$asset"; fi

      - name: Upload the artefact
        if: needs.resolve.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # The create-release job makes the release before this runs. A
          # missing release here means that job did not run; say so rather
          # than failing on an opaque upload error.
          gh release view "$TAG" >/dev/null 2>&1 || {
            echo "::error::release $TAG does not exist. The create-release job should have made it." >&2
            exit 1
          }
          gh release upload "$TAG" "$ASSET" --clobber

  checksums:
    needs: [resolve, verify-version, build]
    if: needs.resolve.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.githubapp.com:443
            fulcio.sigstore.dev:443
            tuf-repo.github.com:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.githubapp.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - name: Build SHA256SUMS from the uploaded assets
        id: sums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TOOL: ${{ needs.resolve.outputs.tool }}
          # This job never checks the repo out, so gh cannot infer the repo
          # from a git remote the way it does in the build jobs. Passing it
          # explicitly is cheaper than a checkout it has no other use for.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          # Download exactly the five artefacts, never a previous SHA256SUMS.
          gh release download "$TAG" --pattern "${TOOL}-${VERSION}-*" --clobber
          count="$(find . -type f | wc -l | tr -d ' ')"
          if [ "$count" -ne 5 ]; then
            echo "::error::expected 5 artefacts, found $count. Refusing to publish a partial SHA256SUMS." >&2
            find . -type f
            exit 1
          fi
          shasum -a 256 "${TOOL}"-* > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ needs.resolve.outputs.tool }}-*
            dist/SHA256SUMS
