# Managed by the agent-factory GitHub App, do not edit by hand, changes will be
# overwritten on the next provisioning run. Job logic lives in protocortex/agent-workflows.
name: Agent Triage

on:
  issues:
    types: [labeled]

jobs:
  triage:
    if: github.event.label.name == 'agent:triage'
    uses: protocortex/agent-workflows/.github/workflows/agent-triage.yml@v1.4.1
    with:
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
      model: "claude-sonnet-5-5"
      effort: "medium"
      timeout_minutes: 60
      extra_allowed_domains: ""
    secrets: inherit
