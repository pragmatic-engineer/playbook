# Managed by the agent-factory GitHub App, do not edit by hand, changes will be
# overwritten on the next provisioning run. Job logic lives in protocortex/agent-workflows.
name: Agent Triage

on:
  issues:
    types: [labeled]

jobs:
  triage:
    if: github.event.label.name == 'agent:triage'
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: protocortex/agent-workflows/.github/workflows/agent-triage.yml@v1.4.2
    with:
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
      model: "claude-sonnet-5-5"
      effort: "medium"
      timeout_minutes: 60
      extra_allowed_domains: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
