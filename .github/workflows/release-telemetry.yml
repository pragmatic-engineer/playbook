#
# Attaches verified playbook-telemetry binaries to a release that already exists:
# a release is cut by pushing a signed annotated tag `telemetry-vX.Y.Z` and then
# running `gh release create telemetry-vX.Y.Z --target main --latest=false`. The
# `--latest=false` keeps GitHub's "latest release" on the playbook `vX.Y.Z` line. This workflow does NOT create the
# release, it builds, ad hoc codesigns and uploads the binaries plus
# SHA256SUMS, then attests their build provenance. It is adapted from the
# release workflow of pragmatic-engineer/playbook and builds the same five
# targets:
#   aarch64-apple-darwin        macos-latest, native
#   x86_64-apple-darwin         macos-latest, cross
#   x86_64-unknown-linux-musl   ubuntu-latest, native musl-gcc + rust-lld
#   aarch64-unknown-linux-musl  ubuntu-24.04-arm, native musl-gcc + rust-lld
#   x86_64-pc-windows-msvc      windows-latest
#
# rusqlite's `bundled` feature compiles SQLite's C source and needs a real C
# compiler, so both musl legs install `musl-tools` and build on a runner of
# their own architecture instead of cross-compiling C.
#
# Why `codesign --force`: on Apple Silicon the linker already ad-hoc signs the
# native binary, while the cross-built x86_64 one comes out unsigned.
# `--force` covers both cases in one step.
#
# This workflow only runs on a pushed tag or `workflow_dispatch`, so the first
# real run is the first release. Watch that run, since the checksums step
# requires all five targets to succeed.

name: release-telemetry

on:
  push:
    tags: ['telemetry-v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-telemetry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fail before spending five build legs on a version mismatch.
  verify-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Tag and Cargo.toml must agree
        id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#telemetry-v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/telemetry/Cargo.toml | head -1)"

          echo "tag:        $tag (version $tag_version)"
          echo "crates/telemetry/Cargo.toml: $cargo_version"

          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::version mismatch: tag=$tag_version crates/telemetry/Cargo.toml=$cargo_version. Both must agree before publishing." >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            linker: rust-lld
            cc: musl-gcc
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            linker: rust-lld
            cc: musl-gcc
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        # Linux-only action; it self-skips elsewhere with a confusing warning
        # (same convention as rust-ci.yml and shell-ci.yml).
        if: runner.os == 'Linux'
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            archive.ubuntu.com:443
            azure.archive.ubuntu.com:80
            crates.io:443
            github.com:443
            index.crates.io:443
            objects.githubusercontent.com:443
            security.ubuntu.com:443
            static.crates.io:443
            static.rust-lang.org:443
            uploads.github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Install the musl C compiler
        # rusqlite's `bundled` feature compiles SQLite's C source and needs
        # a real C compiler.
        # `musl-tools` gives `musl-gcc`, which only ever targets the
        # runner's OWN arch, so this only works because both musl legs now
        # run on a same-arch runner (ubuntu-latest for x86_64,
        # ubuntu-24.04-arm for aarch64): neither leg cross-compiles C.
        if: matrix.cc == 'musl-gcc'
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        env:
          RELEASE_LINKER: ${{ matrix.linker }}
          RELEASE_CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_LINKER:-}" ]; then
            # Uppercase the target and swap dashes, per cargo's env var naming.
            tu="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
            export "CARGO_TARGET_${tu}_LINKER=${RELEASE_LINKER}"
          fi
          if [ -n "${RELEASE_CC:-}" ]; then
            # cc-rs's own env var convention: lowercase target, underscores
            # instead of dashes (distinct from cargo's CARGO_TARGET_* casing
            # above). Verified in CI on the x86_64 leg (container-smoke and
            # PRs #285-287).
            tc="$(echo '${{ matrix.target }}' | tr '-' '_')"
            export "CC_${tc}=${RELEASE_CC}"
          fi
          cargo build --release -p playbook-telemetry --target ${{ matrix.target }}

      - name: Ad-hoc sign the macOS binaries
        if: runner.os == 'macOS'
        run: for b in playbook-telemetry pbtop; do codesign --sign - --force target/${{ matrix.target }}/release/$b; done

      - name: Confirm the macOS signature is adhoc
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          for b in playbook-telemetry pbtop; do
            codesign -dvv target/${{ matrix.target }}/release/$b 2>&1 | tee /tmp/cs.txt
            grep -q 'Signature=adhoc' /tmp/cs.txt
          done

      - name: Confirm the linux binaries are static
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for b in playbook-telemetry pbtop; do
            file -b target/${{ matrix.target }}/release/$b | tee /tmp/f.txt
            grep -qE 'static-pie linked|statically linked' /tmp/f.txt
          done

      - name: Name and upload the artefact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          set -euo pipefail
          # One archive per target holding both binaries.
          asset="playbook-telemetry-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" \
            "playbook-telemetry${{ matrix.ext }}" "pbtop${{ matrix.ext }}"
          assets=("$asset")
          # The release is created by the maintainer before this runs; see the
          # header. A missing release is a procedure error, not a build error,
          # so say so rather than failing on an opaque upload error.
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || {
            echo "::error::release ${GITHUB_REF_NAME} does not exist. Create it first with: gh release create ${GITHUB_REF_NAME} --target main" >&2
            exit 1
          }
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber

  checksums:
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.githubapp.com:443
            fulcio.sigstore.dev:443
            tuf-repo.github.com:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.githubapp.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - name: Build SHA256SUMS from the uploaded assets
        id: sums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify-version.outputs.version }}
          # This job never checks the repo out, so gh cannot infer the repo
          # from a git remote the way it does in the build jobs. Passing it
          # explicitly is cheaper than a checkout it has no other use for.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          # Download exactly the five archives, never a previous SHA256SUMS.
          gh release download "${GITHUB_REF_NAME}" --pattern "playbook-telemetry-${VERSION}-*.tar.gz" --clobber
          count="$(find . -type f | wc -l | tr -d ' ')"
          if [ "$count" -ne 5 ]; then
            echo "::error::expected 5 artefacts, found $count. Refusing to publish a partial SHA256SUMS." >&2
            find . -type f
            exit 1
          fi
          shasum -a 256 playbook-telemetry-* > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          cat SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --clobber

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/playbook-telemetry-*
            dist/SHA256SUMS

  # Fast path to Homebrew: tell the tap a release exists so the formula is
  # bumped within minutes. The tap also checks daily, so this is only a speed
  # up. It needs the TAP_DISPATCH_TOKEN secret; without it the step says so and
  # the job still succeeds.
  notify-tap:
    needs: [checksums]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Tell the Homebrew tap
        env:
          TAP_DISPATCH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_DISPATCH_TOKEN:-}" ]; then
            echo "TAP_DISPATCH_TOKEN is not set. The tap will pick this release up on its daily run."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${TAP_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pragmatic-engineer/homebrew-tap/dispatches \
            -d '{"event_type":"tool-released","client_payload":{"tool":"playbook-telemetry"}}'
          echo "Sent tool-released to pragmatic-engineer/homebrew-tap."
