#
# CI gate for the Rust binary. Pull requests, the merge queue and pushes to
# main build and test on Linux. macOS builds and tests in the daily run, on a
# manual run, on the release pull request (branch release/v*), and in every
# release: release.yml calls this workflow with the commit it is about to tag,
# and the release stops when macOS is red. Testing the release pull request
# keeps a macOS break from reaching main inside a version bump, where the
# release could not move past it.
#
# A job added below also runs in every release gate unless its `if` has
# `!inputs.ref`, and a red one stops the release.
#
# Validates:
#   - cargo fmt --all --check
#   - cargo clippy --workspace --all-targets -- -D warnings
#   - cargo clippy --lib --bins with unwrap_used and expect_used denied
#   - cargo test
#   - cargo audit, closing the CVE gap flagged when clap, serde and
#     serde_json were approved as dependencies

name: rust-ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  # Daily full matrix on main, macOS included. Pull requests and the merge
  # queue run Linux only, so this catches a platform-only break within a day.
  schedule:
    - cron: "17 5 * * *"
  # The full matrix on demand, macOS included.
  workflow_dispatch:
  # The release gate (release.yml): macOS build and test of one commit.
  workflow_call:
    inputs:
      ref:
        description: 'The commit to build and test on macOS.'
        required: true
        type: string
    outputs:
      sha:
        description: 'The commit the macOS lane checked out and tested.'
        value: ${{ jobs.build-test.outputs.sha }}

permissions: {}

# Every job builds once per run, so incremental data and debug info only add
# compile time, link time and cache size. Release builds already have neither.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# A release gate gets a group per commit, and the daily and manual runs groups
# of their own, so none of them waits behind or cancels a push to main.
concurrency:
  group: rust-ci-${{ inputs.ref && format('gate-{0}', inputs.ref) || (github.event_name == 'schedule' && 'schedule') || (github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.ref)) || github.ref }}
  # Only a newer pull request or queue run cancels an older one. A push to
  # main saves the cargo cache, and back-to-back merges were cancelling it
  # before the save step.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  # Classifies the change so docs-only PRs skip the heavy lanes. Required
  # checks must still report, so the gated jobs below keep running and skip at
  # STEP level (a skipped matrix job would leave "build-test (<os>)" pending and
  # block the merge queue). Fails open: any error means docs_only=false.
  #
  # Docs-only means every changed path is a root policy file (README.md,
  # CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md, CHANGELOG.md) or a *.md
  # under docs/. prompts/, hooks/ and .github/ are never docs-only: tests
  # read them.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      # Cargo package selection for clippy, tests and doc tests: `--workspace`,
      # or `-p a -p b` when only crates/<name> folders changed, plus every
      # crate that depends on them. Anything outside crates/ (Cargo.lock, the
      # root manifest, the toolchain, hooks, .github) selects the
      # whole workspace, and so does any error.
      pkgs: ${{ steps.classify.outputs.pkgs }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          docs_only=false
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$MG_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -n "$base" ] && [ "${base#0000000}" = "$base" ] \
              && git fetch --no-tags --depth=1 origin "$base" 2>/dev/null \
              && files="$(git diff --name-only --no-renames "$base" HEAD)" \
              && [ -n "$files" ]; then
            echo "$files"
            if ! echo "$files" | grep -qvE '^(docs/.+\.md|(README|CONTRIBUTING|SECURITY|CODE_OF_CONDUCT|CHANGELOG)\.md)$'; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

          # Package selection. A crate maps to itself plus its dependents:
          # cli (playbook) depends on common, code, data and telemetry; code and
          # telemetry depend on data; common is depended on by everything.
          pkgs="--workspace"
          if [ -n "${files:-}" ] && ! echo "$files" | grep -qvE '^crates/(cli|code|common|data|telemetry)/'; then
            sel=""
            add() { case " $sel " in *" $1 "*) ;; *) sel="$sel $1" ;; esac; }
            for c in $(echo "$files" | sed -E 's#^crates/([^/]+)/.*#\1#' | sort -u); do
              case "$c" in
                common) sel=""; pkgs="--workspace"; break ;;
                cli) add playbook ;;
                code) add playbook-code; add playbook ;;
                telemetry) add playbook-telemetry; add playbook ;;
                data) add playbook-data; add playbook-code; add playbook-telemetry; add playbook ;;
              esac
            done
            if [ -n "$sel" ]; then
              pkgs=""
              for p in $sel; do pkgs="$pkgs -p $p"; done
              pkgs="${pkgs# }"
            fi
          fi
          echo "pkgs=$pkgs" | tee -a "$GITHUB_OUTPUT"

  # The macOS leg always reports, because "build-test (macos-latest)" is a
  # required check. It builds and tests on the daily run, a manual run, the
  # release pull request and a release gate (a call from release.yml, whose
  # event is workflow_dispatch). Anywhere else it skips its steps on a Linux
  # runner, so it costs no macOS runner. The check name comes from the matrix
  # value, never the runner. A release gate runs the macOS leg alone.
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.ref && '["macos-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    needs: changes
    # Run even if `changes` failed (fail open); never let a skipped needs
    # turn a required check into a skipped one.
    if: ${{ !cancelled() }}
    # The macOS condition here and in LANE below must stay the same.
    runs-on: ${{ (matrix.os == 'macos-latest' && !(github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v') || (inputs.ref || '') != '')) && 'ubuntu-latest' || matrix.os }}
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    env:
      # Whether this leg builds and tests. Each step below checks it. The
      # macOS condition matches runs-on above and reads only the event, and
      # a missing docs_only output counts as not docs-only, so it fails open.
      LANE: ${{ needs.changes.outputs.docs_only != 'true' && (matrix.os != 'macos-latest' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v') || (inputs.ref || '') != '') }}
      # Whether this leg saves the cargo cache: Linux after a push to main,
      # macOS after a daily or manual run on main, the runs that build it
      # there. A release gate never saves, so it does not slow the release.
      SAVE_CACHE: ${{ (github.event_name == 'push' && matrix.os == 'ubuntu-latest') || (matrix.os == 'macos-latest' && github.ref == 'refs/heads/main' && (inputs.ref || '') == '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) }}
      # Single source of truth for the cache key and the install command
      # below, so they can't drift apart. Bump deliberately, not implicitly.
      CARGO_AUDIT_VERSION: "0.22.2"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        # Linux-only action; it self-skips on macOS with a confusing warning
        # (same convention as shell-ci.yml).
        if: runner.os == 'Linux' && env.LANE == 'true'
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.LANE == 'true'
        with:
          # Set only by a release gate. Empty means the event's commit.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The commit under test, which a release gate hands back to release.yml.
      - name: Record the commit under test
        id: head
        if: env.LANE == 'true'
        run: echo "sha=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"

      - name: Cache cargo registry and build output (build-test)
        id: cargo
        if: env.LANE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-build-test-v3-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-build-test-v3-${{ runner.os }}-

      # Prints the version rust-toolchain.toml actually resolved to, so a
      # reviewer can confirm the pin took effect from the job log instead of
      # trusting rustup's documented override behavior on faith.
      - name: rustc --version
        if: env.LANE == 'true'
        run: rustc --version

      - name: Ensure rustfmt and clippy components
        if: env.LANE == 'true'
        run: rustup component add rustfmt clippy

      - name: cargo fmt --all --check
        if: env.LANE == 'true'
        run: cargo fmt --all --check

      - name: cargo clippy
        if: env.LANE == 'true'
        run: cargo clippy ${{ needs.changes.outputs.pkgs || '--workspace' }} --all-targets -- -D warnings

      # Non-test code must not panic on bad input: unwrap and expect are errors
      # there. Tests may use them, so this covers the library and the binary only.
      - name: cargo clippy (no unwrap or expect outside tests)
        if: env.LANE == 'true'
        run: cargo clippy ${{ needs.changes.outputs.pkgs || '--workspace' }} --lib --bins -- -D warnings -D clippy::unwrap_used -D clippy::expect_used

      # nextest schedules every test across all test binaries, where
      # `cargo test` runs the binaries one after another. Pinned like the
      # other tools: the action to a commit SHA, the tool to a release older
      # than two weeks. It downloads a prebuilt binary from github.com.
      - name: Install cargo-nextest
        if: env.LANE == 'true'
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest@0.9.145

      - name: cargo nextest run
        if: env.LANE == 'true'
        run: cargo nextest run ${{ needs.changes.outputs.pkgs || '--workspace' }} --no-tests=pass --config-file .github/nextest.toml --profile ci

      # nextest does not run doctests, and `cargo test --doc` builds every
      # selected crate again to look for them. This runs it only for crates
      # with a ``` or ~~~ fence in a /// or //! comment, a /** or /*! block,
      # or a doc attribute. An indented code block alone is not detected.
      - name: cargo test --doc (crates with doctests)
        if: env.LANE == 'true'
        env:
          PKGS: ${{ needs.changes.outputs.pkgs || '--workspace' }}
        run: |
          set -euo pipefail
          sel=""
          for toml in crates/*/Cargo.toml; do
            dir="${toml%/Cargo.toml}"
            [ -d "$dir/src" ] || continue
            grep -rqE '^[[:space:]]*(//[/!].*(```|~~~)|/\*[*!]|#!?\[(cfg_attr\(.*)?doc *=)' "$dir/src" || continue
            name="$(sed -n 's/^name *= *"\(.*\)"/\1/p' "$toml" | head -1)"
            case " $PKGS " in *" --workspace "*|*" -p $name "*) sel="$sel -p $name" ;; esac
          done
          if [ -z "$sel" ]; then
            echo "No selected crate has a doctest."
            exit 0
          fi
          # shellcheck disable=SC2086
          cargo test $sel --doc

      # Moved out of shell-ci with the port: the seed validator is now a
      # subcommand, so it needs a built binary and belongs on this lane.
      - name: Validate the shipped settings seed
        if: env.LANE == 'true'
        run: |
          cargo build
          ./target/debug/playbook settings check settings.shared.json .

      # Moved out of shell-ci with the port, same reasoning: the manifest
      # validator is now a subcommand too, so it needs the binary already
      # built by the step above.
      - name: Validate the tracked-file manifest
        if: env.LANE == 'true'
        run: ./target/debug/playbook manifest check .

      - name: Validate the plugin agents
        if: env.LANE == 'true'
        run: ./target/debug/playbook agents check plugins/playbook/agents

      # Warn-only for now: the findings show as annotations and never fail the
      # job. `--strict` would fail it on a hard finding.
      - name: Check the docs prose
        if: env.LANE == 'true' && runner.os == 'Linux'
        continue-on-error: true
        run: ./target/debug/playbook prose check docs/adr/*.md

      # cargo-audit's own `cargo install --locked` compiles it from source
      # every run, ~2 minutes on ubuntu-latest, the single most expensive
      # step in this job by far (measured: musl-tools + rustup target add
      # combined cost 13 seconds in the container-smoke job, for comparison).
      # Cache the compiled binary, keyed on a pinned version so a cache hit
      # is always the exact version this job expects, never a stale one
      # silently reused past its actual pin.
      #
      # No allowed-endpoints entry needed for the cache backend, unlike
      # scorecard.yml (stays on audit mode) and osv-scan.yml (allowlists
      # results-receiver.actions.githubusercontent.com): those two are about
      # the Actions RESULTS/artifact-upload backend, a different subsystem
      # with rotating regional endpoints harden-runner can't allowlist
      # statically. actions/cache itself gets special-cased: harden-runner
      # v1.5.0+ auto-detects and allows its endpoint at runtime even in
      # block mode, no config needed (confirmed via StepSecurity's own
      # docs). This job pins v2.21.1, well above that floor. Watch the
      # first real run's harden-runner insights to confirm the cache
      # actually populates rather than assuming this holds forever.
      - name: Cache cargo-audit binary
        if: env.LANE == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: cargo audit
        if: env.LANE == 'true'
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo-audit" ]; then
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          fi
          # The advisory DATABASE still updates every run regardless of the
          # cache: cargo-audit fetches it fresh from the rustsec advisory-db
          # repo at scan time, so caching the binary doesn't freeze which
          # CVEs get caught, only skips recompiling the same binary.
          cargo audit

      # The key changes only with Cargo.lock and the toolchain, and almost
      # every change rebuilds the workspace crates, so the cache keeps only
      # what dependencies need: their compiled output and the downloaded
      # crate files. Every output of a workspace unit (named by the hash in
      # its .fingerprint folder), the incremental data and the unpacked
      # sources (cargo unpacks them again from the downloads) go. Outputs of
      # dependency versions Cargo.lock no longer uses stay until the key
      # version is bumped.
      - name: Trim the cargo cache before saving
        id: trim
        if: env.SAVE_CACHE == 'true' && success() && steps.cargo.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          du -sh target ~/.cargo/registry
          rm -rf ~/.cargo/registry/src target/debug/incremental target/debug/examples
          find target/debug -maxdepth 1 -type f -delete
          for f in target/debug/.fingerprint/playbook*-* target/debug/.fingerprint/pbtop*-*; do
            [ -e "$f" ] || continue
            find target/debug/deps -maxdepth 1 -name "*-${f##*-}*" -delete
            rm -rf "$f"
          done
          rm -rf target/debug/build/playbook*-* target/debug/build/pbtop*-*
          du -sh target ~/.cargo/registry

      - name: Save cargo registry and build output (build-test)
        if: steps.trim.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo.outputs.cache-primary-key }}

  # Cheap lane for docs-only changes: the only cargo tests that read docs
  # (generated reference page drift, config-key coverage, README and index
  # links, the policy table, the PR-flow wording). Runs only when the heavy
  # lanes are skipped.
  docs-checks:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Saved only by a push to main, so a pull request does not store a
      # copy only its own runs can read. v2: built without debug info.
      - name: Restore cargo registry and build output (docs-checks)
        id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-docs-checks-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-docs-checks-v2-${{ runner.os }}-

      - name: cargo test (doc-reading tests only)
        run: cargo test -p playbook --test reference_docs

      # Warn-only, like the same check in the build lane: an ADR-only change
      # takes this lane, so it needs the check too.
      - name: Check the docs prose
        continue-on-error: true
        run: cargo run -q -p playbook -- prose check docs/adr/*.md

      - name: Save cargo registry and build output (docs-checks)
        if: success() && github.event_name == 'push' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo.outputs.cache-primary-key }}

  # release.yml builds five targets, but nothing else ever compiled for
  # Windows, so `std::os::unix` reached the lib unnoticed and every Windows
  # release leg failed on the first tag ever pushed. This lane guards exactly
  # what release.yml builds (lib and bin, not tests) on the one platform the
  # other lanes cannot cover.
  #
  # `cargo check`, not `cargo build`: type-checking catches the whole
  # cfg-gating class without paying for a link, and linking is what
  # release.yml is for. Tests are excluded on purpose; several still use
  # unix-only APIs and making them portable is separate work.
  windows-check:
    needs: changes
    # Already ran on the PR head; the queue re-runs Linux build-test only. A
    # release gate runs macOS only.
    if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'merge_group' && !inputs.ref
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Saved only by a push to main, so a pull request does not store a
      # copy (about 350 MB) only its own runs can read. v2: built without
      # debug info.
      - name: Restore cargo registry and build output (windows-check)
        id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-check-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-windows-check-v2-${{ runner.os }}-

      - name: cargo check (lib and bin)
        run: cargo check --workspace --bins --lib

      - name: Save cargo registry and build output (windows-check)
        if: success() && github.event_name == 'push' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo.outputs.cache-primary-key }}

  # ADR 0007: a container built FROM debian:stable-slim with only git and
  # the binary installed runs every hook successfully, asserted by CI, not
  # by inspection. The hooks in `HookName` (the list is read from
  # `playbook hook --help`, so a new hook is covered automatically) are the
  # whole contract `settings.json` invokes as a bare
  # `playbook hook <name>` command; if any of them needed something
  # the old shell installers used to provide (a shared library, a Python interpreter, anything beyond
  # `git`), this job is where that would show up, on the platform the tool
  # actually ships for, not on the dev machine that already has everything
  # installed.
  #
  # Static musl, not the glibc dev build: the release binaries are musl, and
  # a glibc build would silently pass here while failing on a real minimal
  # container the way a user's actually would.
  #
  # Empty `{}` JSON input, not a real payload: every hook's own "never
  # panic" contract already means malformed or empty input degrades to
  # silence or a best-effort no-op, verified locally before this job
  # existed: every hook but the two worktree ones exits 0 on `{}`. Those two
  # act on a git repo, so they get a payload against a throwaway repo inside
  # the container. What this job checks is
  # narrower and different, whether the compiled binary can even START in a
  # container that has nothing but git, which `cargo test` never exercises
  # since it always runs on a machine with the full toolchain already
  # present.
  #
  # One matrix job for both musl targets, not two near-identical jobs: this
  # used to be container-smoke (x86_64, ubuntu-latest) and
  # container-smoke-arm64 (aarch64, ubuntu-24.04-arm) as separate copy-pasted
  # jobs. Both legs run NATIVELY on real hardware for this target (no
  # cross-compilation, no emulation): this repo is public, so
  # ubuntu-24.04-arm (GA since 2025-08, free for public repos) builds and
  # runs the aarch64-unknown-linux-musl leg on real arm64 hardware the same
  # way ubuntu-latest does for x86_64. This is the only place the aarch64 leg
  # gets exercised before a real release tag: release.yml's aarch64 leg
  # (identical musl-tools technique, same matrix pattern) only runs on a
  # pushed tag or workflow_dispatch, never on a pull request.
  container-smoke:
    needs: changes
    # Already ran on the PR head; the queue re-runs Linux build-test only. A
    # release gate runs macOS only.
    if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'merge_group' && !inputs.ref
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # audit, not block: this job pulls the debian:stable-slim base
          # image and apt-get installs git INSIDE that container, both
          # against Docker Hub / Debian archive mirrors that rotate per
          # runner placement, the same reasoning shell-ci.yml already
          # documents for its own apt-get step.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The built binary, keyed on what builds it: the crates, the Cargo
      # files, the toolchain, the files the binary embeds with include_str!
      # outside crates/, and this workflow, which holds the build step. A run
      # with the same inputs reuses the binary of an earlier run and skips
      # the build, most of this job. Add a file here when an include_str!
      # starts reading one outside crates/. The daily run always rebuilds,
      # so a change on the runner image still shows within a day. The static
      # check and the container tests below run on every path.
      - name: Restore the smoke binary
        id: bin
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: smoke-bin/playbook
          key: smoke-bin-v1-${{ matrix.target }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'crates/**', 'Brewfile', 'settings.shared.json', 'prompts/**', 'breaking-changes.json', 'plugins/playbook/skills/*/SKILL.md', '.github/workflows/rust-ci.yml') }}

      # Every step from here to the cargo save runs only when the binary was
      # not restored, and carries the same `if`.
      #
      # Restored from a push to main, saved only there. Pull request runs
      # saved their own copy before, about 600 MB per target, which only
      # that pull request's later runs could read. A pull request that
      # changes Cargo.lock now rebuilds the changed crates on each push.
      - name: Restore cargo registry and build output (container-smoke)
        id: cargo
        if: steps.bin.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-container-smoke-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-container-smoke-${{ matrix.target }}-

      - name: Add the musl target
        if: steps.bin.outputs.cache-hit != 'true'
        run: rustup target add ${{ matrix.target }}

      - name: Install the musl C cross-compiler
        # rusqlite's `bundled` feature compiles SQLite's C source (via
        # libsqlite3-sys) and needs a real C compiler to build it, unlike
        # the rest of this crate graph (clap, serde, serde_json), which is
        # why this step didn't exist before the gate DB. `musl-tools` gives
        # us `musl-gcc` on either arch, since both legs run natively on a
        # same-arch runner; cc-rs is told about it via the target-specific
        # `CC_*` env var in the build step below rather than a symlink,
        # since the binary it ships is named `musl-gcc`, not the
        # `<arch>-linux-musl-gcc` cc-rs guesses by default.
        if: steps.bin.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools

      - name: Build the release binary (static musl)
        if: steps.bin.outputs.cache-hit != 'true'
        # rust-lld still links the final binary (matches release.yml's own
        # musl legs): musl-gcc only compiles the bundled sqlite3.c into
        # object files, it never becomes the linker driver, so the musl
        # target's self-contained sysroot linking that already worked for
        # the pure-Rust build is unaffected.
        #
        # Env var names are derived from matrix.target at runtime, the same
        # technique release.yml's build job already uses, rather than a
        # second matrix column: cargo's CARGO_TARGET_* wants the target
        # uppercased with underscores, cc-rs's CC_* wants it lowercased with
        # underscores, and hand-listing both per target is exactly the
        # duplication this job merge is removing.
        run: |
          set -euo pipefail
          tu="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
          tc="$(echo '${{ matrix.target }}' | tr '-' '_')"
          export "CARGO_TARGET_${tu}_LINKER=rust-lld"
          export "CC_${tc}=musl-gcc"
          cargo build --release -p playbook --target ${{ matrix.target }}
          mkdir -p smoke-bin
          cp target/${{ matrix.target }}/release/playbook smoke-bin/playbook

      # The daily run skips the restore, so it has no key to save under.
      - name: Save the smoke binary
        if: steps.bin.outputs.cache-hit != 'true' && steps.bin.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: smoke-bin/playbook
          key: ${{ steps.bin.outputs.cache-primary-key }}

      - name: Save cargo registry and build output (container-smoke)
        if: steps.bin.outputs.cache-hit != 'true' && steps.cargo.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo.outputs.cache-primary-key }}

      - name: Confirm the binary is static
        run: |
          set -euo pipefail
          file -b smoke-bin/playbook | tee /tmp/f.txt
          grep -qE 'static-pie linked|statically linked' /tmp/f.txt

      - name: Run every hook inside a minimal debian container
        run: |
          docker run --rm \
            -v "$PWD/smoke-bin/playbook:/usr/local/bin/playbook:ro" \
            debian:stable-slim \
            bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq git >/dev/null
              names="$(playbook hook --help | grep -o "possible values: .*\]" | sed "s/possible values: //; s/\]//; s/,//g")"
              count=0
              for name in $names; do
                case "$name" in worktree-create|worktree-remove) continue ;; esac
                echo "== $name"
                echo "{}" | HOME=/tmp playbook hook "$name" \
                  || { echo "FAILED: $name did not exit 0 in a minimal container"; exit 1; }
                count=$((count + 1))
              done

              # The worktree hooks need a real repo; the container is
              # throwaway (--rm), so nothing outlives the job.
              export HOME=/tmp GIT_AUTHOR_NAME=smoke GIT_AUTHOR_EMAIL=smoke@example.com \
                     GIT_COMMITTER_NAME=smoke GIT_COMMITTER_EMAIL=smoke@example.com
              mkdir -p /tmp/wt/repo
              git -C /tmp/wt/repo init -q -b main
              git -C /tmp/wt/repo commit -q --allow-empty -m init
              echo "== worktree-create"
              path="$(echo "{\"cwd\":\"/tmp/wt/repo\",\"name\":\"smoke\"}" | playbook hook worktree-create)" \
                || { echo "FAILED: worktree-create did not exit 0"; exit 1; }
              test -d "$path" || { echo "FAILED: worktree-create printed $path, not a directory"; exit 1; }
              count=$((count + 1))
              echo "== worktree-remove"
              echo "{\"cwd\":\"/tmp/wt/repo\",\"worktree_path\":\"$path\"}" | playbook hook worktree-remove \
                || { echo "FAILED: worktree-remove did not exit 0"; exit 1; }
              test ! -e "$path" || { echo "FAILED: worktree-remove left $path behind"; exit 1; }
              count=$((count + 1))

              total="$(echo "$names" | wc -w)"
              test "$count" -eq "$total" && test "$total" -gt 0 \
                || { echo "FAILED: ran $count of $total hooks"; exit 1; }
              echo "all $total hooks ran without crashing"
            '

      - name: Exercise gate record/check end to end (rusqlite/SQLite smoke test)
        # The hook loop above predates the gate DB and never opens a
        # database; a hook exiting 0 proves the binary STARTS in a minimal
        # container, not that rusqlite's bundled SQLite actually works at
        # runtime on this target. Round-trip a real verdict through the
        # real CLI to prove that separately.
        run: |
          set -euo pipefail
          bin="$PWD/smoke-bin/playbook"
          work="$(mktemp -d)"
          (cd "$work" && git init -q && git remote add origin https://github.com/smoke-test/smoke-test.git)
          echo "VERDICT: PASS" > "$work/source.txt"
          echo "VERDICT: PASS" | (cd "$work" && "$bin" gate record smoke-test ci fact-check - --source "$work/source.txt")
          (cd "$work" && "$bin" gate check smoke-test ci fact-check --source "$work/source.txt")
          echo "gate record/check round-tripped a real PASS through rusqlite on ${{ matrix.target }}"
