#
# CI gate for the Rust binary. Runs on ubuntu-latest and macos-latest so a
# platform-specific regression is caught on both hosts the binary ships for.
# Validates:
#   - cargo fmt --check
#   - cargo clippy --all-targets -- -D warnings
#   - cargo test
#   - cargo audit, closing the CVE gap flagged when clap, serde and
#     serde_json were approved as dependencies

name: rust-ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # Single source of truth for the cache key and the install command
      # below, so they can't drift apart. Bump deliberately, not implicitly.
      CARGO_AUDIT_VERSION: "0.22.2"
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        # Linux-only action; it self-skips on macOS with a confusing warning
        # (same convention as shell-ci.yml).
        if: runner.os == 'Linux'
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            objects.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Ensure rustfmt and clippy components
        run: rustup component add rustfmt clippy

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      # Moved out of shell-ci with the port: the seed validator is now a
      # subcommand, so it needs a built binary and belongs on this lane.
      - name: Validate the shipped settings seed
        run: |
          cargo build
          ./target/debug/playbook settings check \
            settings.shared.json permissions.shared.json .

      # Moved out of shell-ci with the port, same reasoning: the manifest
      # validator is now a subcommand too, so it needs the binary already
      # built by the step above.
      - name: Validate the tracked-file manifest
        run: ./target/debug/playbook manifest check .

      # Moved out of shell-ci for the same reason as the two validators above.
      - name: Validate agent definitions
        run: ./target/debug/playbook agents check

      # cargo-audit's own `cargo install --locked` compiles it from source
      # every run, ~2 minutes on ubuntu-latest, the single most expensive
      # step in this job by far (measured: musl-tools + rustup target add
      # combined cost 13 seconds in the container-smoke job, for comparison).
      # Cache the compiled binary, keyed on a pinned version so a cache hit
      # is always the exact version this job expects, never a stale one
      # silently reused past its actual pin.
      - name: Cache cargo-audit binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: cargo audit
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo-audit" ]; then
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          fi
          # The advisory DATABASE still updates every run regardless of the
          # cache: cargo-audit fetches it fresh from the rustsec advisory-db
          # repo at scan time, so caching the binary doesn't freeze which
          # CVEs get caught, only skips recompiling the same binary.
          cargo audit

  # release.yml builds five targets, but nothing else ever compiled for
  # Windows, so `std::os::unix` reached the lib unnoticed and every Windows
  # release leg failed on the first tag ever pushed. This lane guards exactly
  # what release.yml builds (lib and bin, not tests) on the one platform the
  # other lanes cannot cover.
  #
  # `cargo check`, not `cargo build`: type-checking catches the whole
  # cfg-gating class without paying for a link, and linking is what
  # release.yml is for. Tests are excluded on purpose; several still use
  # unix-only APIs and making them portable is separate work.
  windows-check:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: cargo check (lib and bin)
        run: cargo check --bins --lib

  # ADR 0007 WU-14 Done-When: a container built FROM debian:stable-slim with
  # only git and the binary installed runs every hook successfully, asserted
  # by CI, not by inspection. The 15 hooks in `HookName` are the whole
  # contract `settings.json` invokes as a bare `playbook hook <name>`
  # command; if any of them needed something setup-local.sh or install.sh
  # used to provide (a shared library, a Python interpreter, anything beyond
  # `git`), this job is where that would show up, on the platform the tool
  # actually ships for, not on the dev machine that already has everything
  # installed.
  #
  # Static musl, not the glibc dev build: the release binaries are musl, and
  # a glibc build would silently pass here while failing on a real minimal
  # container the way a user's actually would.
  #
  # Empty `{}` JSON input, not a real payload: every hook's own "never
  # panic" contract (see SEGMENT-B-RULES.md) already means malformed or
  # empty input degrades to silence or a best-effort no-op, verified locally
  # before this job existed: all 15 exit 0 on `{}`. What this job checks is
  # narrower and different, whether the compiled binary can even START in a
  # container that has nothing but git, which `cargo test` never exercises
  # since it always runs on a machine with the full toolchain already
  # present.
  #
  # One matrix job for both musl targets, not two near-identical jobs: this
  # used to be container-smoke (x86_64, ubuntu-latest) and
  # container-smoke-arm64 (aarch64, ubuntu-24.04-arm) as separate copy-pasted
  # jobs. Both legs run NATIVELY on real hardware for this target (no
  # cross-compilation, no emulation): this repo is public, so
  # ubuntu-24.04-arm (GA since 2025-08, free for public repos) builds and
  # runs the aarch64-unknown-linux-musl leg on real arm64 hardware the same
  # way ubuntu-latest does for x86_64. This is the only place the aarch64 leg
  # gets exercised before a real release tag: release.yml's aarch64 leg
  # (identical musl-tools technique, same matrix pattern) only runs on a
  # pushed tag or workflow_dispatch, never on a pull request.
  container-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          # audit, not block: this job pulls the debian:stable-slim base
          # image and apt-get installs git INSIDE that container, both
          # against Docker Hub / Debian archive mirrors that rotate per
          # runner placement, the same reasoning shell-ci.yml already
          # documents for its own apt-get step.
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Add the musl target
        run: rustup target add ${{ matrix.target }}

      - name: Install the musl C cross-compiler
        # rusqlite's `bundled` feature compiles SQLite's C source (via
        # libsqlite3-sys) and needs a real C compiler to build it, unlike
        # the rest of this crate graph (clap, serde, serde_json), which is
        # why this step didn't exist before the gate DB. `musl-tools` gives
        # us `musl-gcc` on either arch, since both legs run natively on a
        # same-arch runner; cc-rs is told about it via the target-specific
        # `CC_*` env var in the build step below rather than a symlink,
        # since the binary it ships is named `musl-gcc`, not the
        # `<arch>-linux-musl-gcc` cc-rs guesses by default.
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools

      - name: Build the release binary (static musl)
        # rust-lld still links the final binary (matches release.yml's own
        # musl legs): musl-gcc only compiles the bundled sqlite3.c into
        # object files, it never becomes the linker driver, so the musl
        # target's self-contained sysroot linking that already worked for
        # the pure-Rust build is unaffected.
        #
        # Env var names are derived from matrix.target at runtime, the same
        # technique release.yml's build job already uses, rather than a
        # second matrix column: cargo's CARGO_TARGET_* wants the target
        # uppercased with underscores, cc-rs's CC_* wants it lowercased with
        # underscores, and hand-listing both per target is exactly the
        # duplication this job merge is removing.
        run: |
          set -euo pipefail
          tu="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
          tc="$(echo '${{ matrix.target }}' | tr '-' '_')"
          export "CARGO_TARGET_${tu}_LINKER=rust-lld"
          export "CC_${tc}=musl-gcc"
          cargo build --release --target ${{ matrix.target }}

      - name: Confirm the binary is static
        run: |
          set -euo pipefail
          file -b target/${{ matrix.target }}/release/playbook | tee /tmp/f.txt
          grep -qE 'static-pie linked|statically linked' /tmp/f.txt

      - name: Run every hook inside a minimal debian container
        run: |
          docker run --rm \
            -v "$PWD/target/${{ matrix.target }}/release/playbook:/usr/local/bin/playbook:ro" \
            debian:stable-slim \
            bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq git >/dev/null
              for name in session-init preread-edit-check preread-size-check \
                          search-counter memory-anchors post-edit-track \
                          rebuild-memory-graph auto-model-detect precompact-warn \
                          session-clean-exit memory-capture rm-workspace-guard \
                          bg-await-guard no-dash-guard precommit-check; do
                echo "== $name"
                echo "{}" | HOME=/tmp playbook hook "$name" \
                  || { echo "FAILED: $name did not exit 0 in a minimal container"; exit 1; }
              done
              echo "all 15 hooks ran without crashing"
            '

      - name: Exercise gate record/check end to end (rusqlite/SQLite smoke test)
        # The 15-hook loop above predates the gate DB and never opens a
        # database; a hook exiting 0 proves the binary STARTS in a minimal
        # container, not that rusqlite's bundled SQLite actually works at
        # runtime on this target. Round-trip a real verdict through the
        # real CLI to prove that separately.
        #
        # Skip gracefully if `gate` isn't wired yet: this workflow file and
        # the gate DB's schema/connection layer land in the same Segment
        # (WU-0), but the `gate record`/`gate check` CLI subcommand itself
        # is a later Segment (WU-1/WU-2) in the same stacked PR sequence.
        # Checking `gate --help` first, rather than assuming the subcommand
        # always exists, is what keeps this step meaningful on every
        # Segment instead of failing the earliest one on a command it
        # never claimed to ship.
        run: |
          set -euo pipefail
          bin="$PWD/target/${{ matrix.target }}/release/playbook"
          if ! "$bin" gate --help >/dev/null 2>&1; then
            echo "gate subcommand not wired yet on this branch, skipping the round-trip"
            exit 0
          fi
          work="$(mktemp -d)"
          (cd "$work" && git init -q)
          echo "VERDICT: PASS" | (cd "$work" && "$bin" gate record smoke-test ci fact-check -)
          (cd "$work" && "$bin" gate check smoke-test ci fact-check)
          echo "gate record/check round-tripped a real PASS through rusqlite on ${{ matrix.target }}"
