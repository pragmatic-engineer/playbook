#
# CI gate for the Rust binary. Runs on ubuntu-latest and macos-latest so a
# platform-specific regression is caught on both hosts the binary ships for.
# Validates:
#   - cargo fmt --check
#   - cargo clippy --all-targets -- -D warnings
#   - cargo test
#   - cargo audit, closing the CVE gap flagged when clap, serde and
#     serde_json were approved as dependencies

name: rust-ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        # Linux-only action; it self-skips on macOS with a confusing warning
        # (same convention as shell-ci.yml).
        if: runner.os == 'Linux'
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            objects.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Ensure rustfmt and clippy components
        run: rustup component add rustfmt clippy

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
