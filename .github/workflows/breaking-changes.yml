#
# A reminder for breaking changes (ADR 0037). The pull request title and body
# become the squash commit, and the release notes list a commit marked
# breaking first, with the text of its BREAKING CHANGE footer. When the title
# has `!` after the type or scope and the body has no such footer, this job
# warns. It does not fail the pull request.

name: breaking-changes

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: breaking-changes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  footer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block

      - name: A breaking pull request says what breaks
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if ! grep -Eq '^[a-z]+(\([^)]*\))?!: ' <<<"$PR_TITLE"; then
            echo "The title is not marked breaking."
            exit 0
          fi
          if grep -Eq '^BREAKING[ -]CHANGE: +[^[:space:]]' <<<"$PR_BODY"; then
            echo "The body has a BREAKING CHANGE footer."
            exit 0
          fi
          echo "::warning title=breaking-changes::the title is marked breaking. Add a line 'BREAKING CHANGE: <what breaks and what to do>' at the end of the body, so the release notes show it."
