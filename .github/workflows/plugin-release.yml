#
# Releases the playbook plugin. The plugin has its own version line in
# plugins/playbook/.claude-plugin/plugin.json. When a push to main changes that
# file or CHANGELOG.md, this workflow reads the version and stops if the tag
# playbook-plugin-v<version> exists. Otherwise it creates the tag and a GitHub
# release whose notes are the "## playbook <version>" section of CHANGELOG.md.
#
# The tag starts with "playbook-plugin-", so the binary release workflow, which
# runs on v*, telemetry-v* and code-v* tags, never sees it. The release is
# created with --latest=false, so the repository's latest release stays on the
# binary line. A changelog fix re-runs the job, so a release that failed for a
# missing section can be recovered. When several versions land while one run is
# still going, GitHub keeps only the newest queued run, so a skipped version is
# released by hand with gh release create.

name: plugin-release

on:
  push:
    branches: [main]
    paths:
      - "plugins/playbook/.claude-plugin/plugin.json"
      - "CHANGELOG.md"

permissions: {}

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read the version and stop when the tag exists
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version // empty' plugins/playbook/.claude-plugin/plugin.json)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::plugin.json has no MAJOR.MINOR.PATCH version"
            exit 1
          fi
          tag="playbook-plugin-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "The tag $tag exists, so there is nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cut the notes from the changelog
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v h="## playbook $VERSION" '
            $0 == h { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no '## playbook $VERSION' section"
            exit 1
          fi

      - name: Create the tag and the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$SHA" \
            --title "playbook plugin $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest=false
