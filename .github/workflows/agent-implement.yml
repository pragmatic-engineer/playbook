# Managed by the agent-factory GitHub App, do not edit by hand, changes will be
# overwritten on the next provisioning run. Job logic lives in protocortex/agent-workflows.
name: Agent Implement

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'agent:implement'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: protocortex/agent-workflows/.github/workflows/agent-implement.yml@v1.5.0
    with:
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
      install_command: "npm ci"
      build_command: "npm run build"
      node_version: "22"
      model: "claude-sonnet-5-5"
      effort: "medium"
      timeout_minutes: 60
      extra_allowed_domains: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENT_PAT: ${{ secrets.AGENT_PAT }}
