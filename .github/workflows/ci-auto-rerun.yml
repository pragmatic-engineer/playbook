#
# Reruns the failed jobs of a CI run once when the failure came from the
# infrastructure (checkout could not reach github.com, a setup step broke, a
# job hit its timeout) and not from the code. GitHub Actions has no native job
# retry. scripts/ci-should-rerun.sh holds the rules.
#
# Security: `workflow_run` runs the workflow from the default branch with a
# write token, even for fork PRs. So this workflow never checks out or runs PR
# code. The checkout below has no `ref`, so it gets the default branch, and it
# only supplies the decision script. Runs from forks are skipped.
#
# This trigger only works once the file is on the default branch, so it cannot
# be tested on the PR that adds it.

name: ci-auto-rerun

on:
  workflow_run:
    # Keep in step with the `name:` of each workflow. Not listed on purpose:
    # this workflow, release (a publish must not repeat on its own),
    # auto-update-pr, dependabot-auto-merge, lock, stale and scorecard.
    workflows:
      - betterleaks
      - breaking-changes
      - CLA & DCO
      - PR Quality Gate
      - commit-message-guard
      - Commit Lint
      - Dependency Review
      - docs-links
      - intents-contract
      - license
      - osv-scan
      - plugin-guards
      - rust-ci
      - shell-ci
      - zizmor
    types: [completed]

permissions: {}

jobs:
  rerun:
    # One automatic rerun at most: only the first attempt is eligible. Fork
    # runs are skipped, see the header.
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_NAME: ${{ github.event.workflow_run.name }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rerun failed jobs after an infrastructure failure
        shell: bash
        run: |
          set -euo pipefail
          expected_attempt=1
          case "$RUN_ID" in
            ''|*[!0-9]*) echo "run id is not numeric" >&2; exit 1 ;;
          esac
          if [ "$RUN_ATTEMPT" != "$expected_attempt" ]; then
            echo "attempt $RUN_ATTEMPT is not the first; no rerun"
            exit 0
          fi

          jobs_file="$RUNNER_TEMP/jobs.json"
          gh run view "$RUN_ID" --json jobs > "$jobs_file"

          decision=0
          report="$(bash scripts/ci-should-rerun.sh --json-file "$jobs_file")" || decision=$?
          {
            echo "### ${RUN_NAME}: ${RUN_URL}"
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$decision" -eq 0 ]; then
            gh run rerun "$RUN_ID" --failed
            echo "Reran the failed jobs of run $RUN_ID once." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$decision" -eq 1 ]; then
            echo "No rerun: the failure looks like code, or no failed job was found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The decision script failed (exit $decision)." >&2
            exit "$decision"
          fi
