#
# cargo-nextest settings, read through --config-file (the repo root allowlist
# does not track a .config directory). Retries stay at 0 so a flaky test fails loudly
# instead of passing on a second try.

[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

# The collector daemon tests spawn real collectors and time their start, so
# they run one at a time. Other profiles inherit this override.
[test-groups]
collector-daemon = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(collector_daemon)'
test-group = 'collector-daemon'
