# Config for zizmor (CI: .github/workflows/zizmor.yml, local: `just zizmor`).
# Every ignore is narrow: one rule, one workflow file, with the reason.
rules:
  dangerous-triggers:
    ignore:
      # Needs base-repo write context to label and comment on fork PRs; never checks out or runs PR code.
      - cla-dco.yml
      # Needs write context to comment on and close fork PRs; has no checkout, reads the diff through the REST API only.
      - clanker-filter.yml
  secrets-outside-env:
    ignore:
      # The repo has no deployment environments; these are repo-level secrets by design.
      - auto-update-pr.yml
      - cla-dco.yml
      - dependabot-auto-merge.yml
      - release.yml
