[package]
name = "playbook"
version = "0.11.0"
edition = "2021"
description = "Claude Code plugin toolkit: hooks, launcher and installer in one binary"
license = "MIT"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
