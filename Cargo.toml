[workspace]
resolver = "2"
members = ["crates/cli", "crates/code", "crates/common", "crates/data", "crates/plugin-checks", "crates/telemetry"]

[workspace.package]
version = "0.34.0"
edition = "2021"
license = "Apache-2.0"

# Curated lints, run with `-D warnings` in CI. Deliberately not all of
# `clippy::pedantic`. The `unwrap_used` and `expect_used` lints cover only
# non-test code, so they run from the justfile and CI as a separate step.
[workspace.lints.clippy]
uninlined_format_args = "warn"
manual_let_else = "warn"
undocumented_unsafe_blocks = "warn"


# Measured 2026-10-09 on macOS arm64: 10.0 MB without a profile, 8.2 MB with
# strip and thin LTO at opt-level 3, 5.8 MB with opt-level s and fat LTO, with no
# slowdown on the hooks. panic stays unwind: abort would change the exit code of
# a panicking hook from 101 to 134.
[profile.release]
opt-level = "s"
strip = true
lto = "fat"
codegen-units = 1

# SQLite is C code that debug builds compile with -O0. Hooks and tests open the
# config database on every run, so build it optimized in dev and test profiles.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
