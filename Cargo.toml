[package]
name = "playbook"
version = "0.18.0"
edition = "2021"
description = "Claude Code plugin toolkit: hooks, launcher and installer in one binary"
license = "Apache-2.0"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
libc = "=0.2.189"
regex = "=1.13.1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
sha2 = "=0.10.9"
tiny_http = "=0.12.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

# Measured 2026-10-09: 10.0 MB, 42 s clean build without this profile; 7.8 MB, 76 s with it.
# panic stays unwind: abort would change the hooks exit code from 101 to 134.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
