# zip 8.6.0 advisories published after the entries above. Each one is
# unreachable here. pbdoc enables only the `deflate` feature (no
# `aes-crypto`, no `legacy-zip`), and neither pbdoc nor anydoc 0.2.4 calls
# ZipArchive::extract, ZipStreamReader or any extraction helper; both only
# read entries in memory. The fix is zip 9, which anydoc 0.2.4 does not
# support (it is the latest anydoc).
# These GHSA ids have no RUSTSEC id yet, so .cargo/audit.toml does not list
# them. Add them there when `cargo audit` starts to report them.

[[IgnoredVulns]]
id = "GHSA-m665-v7pm-7grj"
ignoreUntil = 2026-12-31
reason = "zip cloaking between ZipArchive and ZipStreamReader; extraction only, and neither pbdoc nor anydoc 0.2.4 uses the stream reader or extracts to disk"

[[IgnoredVulns]]
id = "GHSA-hjqx-j4rw-g7xv"
ignoreUntil = 2026-12-31
reason = "zip symlink escape in ZipArchive::extract; pbdoc and anydoc 0.2.4 never extract to disk"

[[IgnoredVulns]]
